name: Validate and publish game

on:
  push:
    branches-ignore:
      - release-channel
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baishi-wending-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test, build static & single-file release
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run release
      - name: Preserve static site and web release
        uses: actions/upload-artifact@v7
        with:
          name: baishi-wending-${{ github.sha }}
          path: |
            dist/
            release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Download validated artifact
        uses: actions/download-artifact@v8
        with:
          name: baishi-wending-${{ github.sha }}
      - name: Publish immutable release and manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          npm run publish:release | tee release/publication-result.txt
          cat release/publication-result.txt >> "$GITHUB_STEP_SUMMARY"

  deploy-cloudflare:
    needs: [validate, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Download validated artifact
        uses: actions/download-artifact@v8
        with:
          name: baishi-wending-${{ github.sha }}
      - name: Deploy static Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not configured; skipped automatic Cloudflare deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run deploy:cloudflare | tee release/cloudflare-deployment.json
          cat release/cloudflare-deployment.json >> "$GITHUB_STEP_SUMMARY"
