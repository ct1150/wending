.paper-page .event-top { background: none; }

.paper-page .event-body { color: var(--text); font-size: 17px; line-height: 2; }
.paper-page .event-decoration { display: none; }
.paper-page .event-panel .choices { padding: 18px; }
.paper-page .battle-actions button { color: var(--text); background: var(--bg); border-color: var(--line2); }
.paper-page .battle-actions button:hover:not(:disabled) { background: var(--paper-hover); }
.paper-page .battle-actions button:disabled { color: var(--muted); background: var(--paper-disabled); border-color: var(--line2); border-style: dashed; }
.paper-page .battle-enemy { width: 54px; height: 54px; margin-top: 15px; }
.paper-page .battle-player { flex-wrap: wrap; gap: 8px 18px; }
.paper-page .battle-log { font-size: 13px; }
.paper-page .battle-actions small { font-size: 12px; white-space: normal; }
.paper-page .ending-symbol { text-shadow: none; font-size: 42px; }
.paper-page .ending .selected-reward { border-color: var(--line2); font-size: 13px; }
.paper-page .ending > .story-result { margin-bottom: 22px; }
.paper-page .story-outcome, .paper-page .story-interruption, .paper-page .story-home,
.paper-page .story-paused { background: var(--panel); border-color: var(--line2); border-radius: 4px; }
.paper-page .story-outcome > p, .paper-page .story-interruption > p, .paper-page .story-home > p,
.paper-page .story-complete-note, .paper-page .story-paused { color: var(--text); font-size: 14px; }
.paper-page .story-outcome .story-world-change { color: var(--text); border-color: var(--line); }
.paper-page .story-outcome .story-inheritance { color: var(--muted); }
.paper-page .story-complete-note { padding-inline: 0; }
.paper-page .notice { display: flex; flex-wrap: wrap; background: var(--panel); border-color: var(--line2); border-radius: 4px; font-size: 13px; color: var(--text); padding: 14px; }
.paper-page .notice.error { border-color: var(--red); color: var(--red); }
.paper-recovery p, .paper-free > p { margin-top: 15px; line-height: 2; }
.paper-recovery h2, .paper-free h2 { font: 25px/1.7 var(--serif); }
.paper-recovery-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.paper-feedback { margin-top: 25px; border-left: 2px solid var(--jade); padding: 12px 16px; }
.paper-feedback p { margin-top: 8px; }
.toast, .toast.error { bottom: 20px; color: var(--text); background: var(--panel2); border-color: var(--line2); box-shadow: 0 4px 20px var(--paper-backdrop); font-size: 13px; }
.toast.error { color: var(--red); border-color: var(--red); }
dialog { background: var(--bg); color: var(--text); border-color: var(--line2); border-radius: 5px; box-shadow: 0 12px 48px var(--paper-backdrop); padding: 24px; }
dialog::backdrop { background: var(--paper-backdrop); backdrop-filter: blur(2px); }
.dialog-body { color: var(--text); font-size: 14px; }
.dialog-body strong { color: var(--text); }
.help-tip { border-color: var(--line2); }
dialog .button { min-height: 44px; color: var(--text); background: var(--panel); border-color: var(--line2); border-radius: 4px; font-size: 13px; }
dialog .button.primary { background: var(--panel2); color: var(--text); border-color: var(--jade); }
dialog .button:hover:not(:disabled) { background: var(--paper-hover); box-shadow: none; }
.icon-button { min-width: 44px; min-height: 44px; }
.icon-button:hover { background: var(--paper-hover); border-color: var(--line2); }
[data-action], [data-combat], [data-choice], #combat-title, #event-title, #ending-title, #latest-log-title { scroll-margin-top: 20px; scroll-margin-bottom: 20px; }
@media (max-width: 560px) {
  .paper-page { padding: 22px 18px; }
  .paper-top { gap: 10px; align-items: flex-start; padding-bottom: 18px; }
  .paper-top h1 { font-size: 21px; letter-spacing: 2px; }
  .paper-tools { gap: 0; flex-direction: column; align-items: flex-end; }
  .paper-tools button { padding: 7px 2px; }
  .paper-main { padding-top: 26px; }
  .paper-page .story-header h2 { font-size: 26px; }
  .paper-page .story-prose p { font-size: 16px; }
  .paper-page .story-choice .choice-label { font-size: 14px; }
  .paper-page .choice { padding: 14px; }
  .paper-page .selection-grid { grid-template-columns: 1fr; }
  .paper-page .selection-grid .select-card { min-height: 0; padding: 16px; }
  .paper-page .origin-grid .select-card h3, .paper-page .origin-grid .select-card p { display: block; }
  .paper-page .action-grid { grid-template-columns: 1fr; }
  .paper-page .action-card { min-height: 0; }
  .paper-page .settings-row, .paper-page .event-top, .paper-page .ending { padding: 18px; }
  .paper-page .story-outcome { padding: 18px; }
  .paper-page .item-grid { grid-template-columns: 1fr; }
  .paper-page .equipment-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .paper-page .legacy-select-grid { grid-template-columns: 1fr; }
  .paper-page .battle-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px; }
  .paper-page .battle-actions button { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 8px; }
  .paper-page .story-paused { margin-inline: 0; }
  .paper-status > div { flex-wrap: wrap; gap: 4px 12px; }
  .paper-status dd { text-align: left; }
  .dialog-actions { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* A compact, persistent identity leaves the reading surface for this moment. */
.paper-page-immersive { padding-top: 0; }
.paper-top-immersive { position: sticky; top: 0; z-index: 30; min-height: 80px; margin-inline: -24px; padding: 10px 24px; gap: 16px; align-items: center; background: var(--bg); }
.paper-top-immersive > div { min-width: 0; }
.paper-top-immersive h1 { font-size: 18px; line-height: 1.4; letter-spacing: 2px; }
.paper-top-immersive .paper-clock { font-size: 12px; margin-top: 2px; }
.paper-top-immersive .paper-tools { flex: 0 0 auto; flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 4px; }
.paper-top-immersive .paper-tools button { padding: 8px; white-space: nowrap; }
.paper-page-immersive .paper-main { padding-top: 28px; }
.journey-identity-bar { display: grid; gap: 2px; flex: 1 1 auto; min-width: 0; min-height: 52px; text-align: left; padding: 3px 0; color: var(--text); }
.journey-identity-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; line-height: 1.5; }
.journey-generation { color: var(--muted); font-size: 12px; flex-shrink: 0; }
.journey-name { font: 18px/1.5 var(--serif); font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.journey-identity-hint { color: var(--muted); font-size: 14px; flex-shrink: 0; }
.journey-identity-facts { display: flex; flex-wrap: wrap; gap: 0 10px; color: var(--muted); font-size: 12px; line-height: 1.8; font-variant-numeric: tabular-nums; }
.journey-identity-facts > span { white-space: nowrap; }
.journey-identity-bar:hover .journey-name { color: var(--jade-bright); }

/* Older prose lives in the history drawer; the latest consequence stays here. */
.journey { min-width: 0; max-width: 38em; margin-inline: auto; }
.journey-location { color: var(--muted); font-size: 13px; }
.journey-block { font: 18px/2.05 var(--serif); margin: 0 0 24px; white-space: pre-line; scroll-margin-top: 100px; }
.journey-voice { display: inline; font: inherit; color: inherit; }
.journey-action-label { color: var(--muted); }
.journey-action { border-inline-start: 2px solid var(--line2); padding-inline-start: 16px; }
.journey-result { color: var(--text); }
.journey-consequence { margin-bottom: 26px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.journey-consequence .journey-block { font-size: 16px; margin: 0; color: var(--muted); }
.journey-current h2 { font: 28px/1.6 var(--serif); margin: 6px 0 22px; scroll-margin-top: 100px; }
.journey-goal { color: var(--muted); font-size: 13px; line-height: 1.8; margin: -10px 0 24px; }
.journey-choices { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 26px; }
.journey-choice { display: block; min-width: 0; width: 100%; min-height: 44px; text-align: left; white-space: normal; padding: 16px 18px; border: 1px solid var(--line2); border-radius: 4px; background: transparent; color: var(--text); line-height: 1.7; overflow-wrap: anywhere; }
.journey-choice:hover:not(:disabled) { background: var(--paper-hover); border-color: var(--jade); }
.journey-choice:disabled { border-style: dashed; }
.journey-choice-label, .journey-choice-reason, .journey-choice-warning { display: block; }
.journey-choice-label { font-size: 16px; }
.journey-choice-reason, .journey-choice-warning { font-size: 13px; color: var(--red); margin-top: 5px; }
.journey-ending { font: 18px/2 var(--serif); margin-block: 28px; }
.journey-ending h3 { font: inherit; margin-bottom: 10px; }
.journey-ending p + p { margin-top: 12px; }

/* Native dialog keeps focus/keyboard behavior; only its body scrolls. */
dialog.paper-drawer { width: min(620px, calc(100vw - 32px)); height: min(820px, calc(100dvh - 32px)); max-height: calc(100dvh - 32px); max-width: calc(100vw - 32px); margin: 16px 16px 16px auto; padding: 0; overflow: hidden; }
dialog.paper-drawer[open] { display: flex; flex-direction: column; }
.paper-drawer .dialog-header { flex: 0 0 auto; padding: 14px 24px; margin: 0; border-bottom: 1px solid var(--line); gap: 12px; }
.paper-drawer .dialog-header h2 { font-size: 21px; letter-spacing: 1px; line-height: 1.5; }
.paper-drawer .dialog-body { flex: 1 1 auto; min-width: 0; min-height: 0; padding: 24px; overflow-y: auto; overscroll-behavior: contain; overflow-wrap: anywhere; }
.paper-drawer .dialog-actions { flex: 0 0 auto; padding: 14px 24px; margin: 0; border-top: 1px solid var(--line); }
.journey-records { min-width: 0; }
.journey-records h3 { font: 18px/1.7 var(--serif); margin: 0 0 20px; color: var(--text); }
.journey-records .journey-block { font-size: 16px; margin-bottom: 20px; scroll-margin-top: 16px; }
.journey-records .journey-action { color: var(--muted); font: 14px/1.9 var(--sans); }
.journey-records details { border-top: 1px solid var(--line); }
.journey-records summary { min-height: 44px; padding: 13px 0; cursor: pointer; color: var(--text); font-size: 14px; line-height: 1.8; }
.journey-record-body { padding: 4px 0 16px; }
.journey-record-body > p { margin-bottom: 14px; }
.journey-record-body > details { margin-top: 12px; }
.journey-past-lives { margin-top: 32px; }
.journey-record-empty { color: var(--muted); margin: 12px 0 24px; }
.journey-records pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.8 var(--sans); max-width: 100%; margin-block: 12px; }

/* Character information is read only, grouped in the drawer. */
.character-details { min-width: 0; }
.character-intro { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-bottom: 16px; }
.character-intro strong { font: 23px/1.5 var(--serif); }
.character-intro > span { font-size: 13px; color: var(--muted); }
.character-facts, .character-inventory { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
.character-facts > div, .character-inventory > div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-block: 9px; font-size: 13px; }
.character-facts dt, .character-inventory dt { color: var(--muted); }
.character-facts dd, .character-inventory dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.character-section { margin-top: 26px; }
.character-section > h3, .character-talents > h3 { color: var(--text); font: 17px/1.7 var(--serif); margin: 0 0 10px; }
.character-attributes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0; }
.character-attributes > div { min-width: 0; padding: 12px 0; border-top: 1px solid var(--line); }
.character-attributes dt { font-size: 13px; color: var(--muted); }
.character-attributes dd { margin: 0; }
.character-attribute-value { font: 27px/1.6 var(--serif); font-variant-numeric: tabular-nums; color: var(--text); }
.character-attribute-scale { font: 12px/1.6 var(--sans); color: var(--dim); }
.character-attribute-description { font-size: 12px; line-height: 1.8; color: var(--muted); }
.character-talents { margin-top: 8px; }
.character-talent { padding: 10px 14px; border-left: 2px solid var(--jade); background: var(--panel); }
.character-talent h4 { font: 17px/1.7 var(--serif); margin: 0 0 4px; }
.character-talent p { font-size: 13px; line-height: 1.8; color: var(--muted); }
.character-talent + .character-talent { margin-top: 10px; }
.character-empty { color: var(--muted); font-size: 13px; }
.character-abilities { list-style: none; padding: 0; margin: 0; }
.character-abilities li + li { margin-top: 16px; }
.character-abilities strong { font: 16px/1.8 var(--serif); }
.character-abilities p { color: var(--muted); font-size: 13px; }

/* A name, one roll and a clear way into the story. */
.birth { max-width: 38em; margin-inline: auto; min-width: 0; }
.birth-heading .birth-kicker { font-size: 12px; color: var(--muted); letter-spacing: 2px; }
.birth-heading h2 { font: 29px/1.6 var(--serif); margin: 6px 0 10px; scroll-margin-top: 100px; }
.birth-heading > p:last-child { color: var(--muted); font: 15px/1.9 var(--serif); }
.birth-name-field { margin-top: 24px; }
.birth-name-field label { display: block; color: var(--text); font-size: 14px; margin-bottom: 8px; }
.birth-name-field input { width: 100%; font-size: 16px; min-height: 48px; padding: 10px 12px; }
.birth-name-help { color: var(--muted); font-size: 12px; margin-top: 7px; }
.birth-name-error { color: var(--red); font-size: 13px; margin-top: 7px; }
.birth-name-error:empty { margin: 0; }
.birth-name-field input[aria-invalid="true"] { border-color: var(--red); }
.birth-fate { margin-top: 25px; }
.birth-fate-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.birth-fate-heading h3 { font: 18px/1.6 var(--serif); }
.paper-page .birth-reroll { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; background: transparent; }
.birth-dice { font: 23px/1 var(--sans); }
.birth-talent { margin-top: 8px; }
.birth-talent-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 7px; }
.birth-roll-count { color: var(--dim); font-size: 12px; margin-top: 10px; text-align: right; }
.birth-origin-section { margin-top: 24px; }
.birth-origin-section h3 { font: 18px/1.6 var(--serif); margin-bottom: 12px; }
.birth-origins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.birth-origin, .birth-lock { min-height: 44px; border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; background: transparent; color: var(--muted); cursor: pointer; font: inherit; }
.birth-origin[aria-pressed="true"], .birth-lock[aria-pressed="true"] { border-color: var(--accent, #8a6744); color: var(--text); background: var(--surface, rgba(138, 103, 68, .08)); }
.birth-hook { font: 16px/1.9 var(--serif); margin-top: 14px; padding-left: 14px; border-left: 2px solid var(--line); }
.birth-lock-help { font-size: 12px; line-height: 1.8; color: var(--muted); margin-bottom: 12px; }
.birth-fate-pair { display: grid; gap: 10px; }
.birth-fate-card { padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; }
.birth-fate-card-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.birth-fate-card-heading h4 { font: 17px/1.6 var(--serif); margin: 0; }
.birth-fate-card p { font-size: 13px; line-height: 1.9; margin: 8px 0 0; color: var(--muted); }
.birth-lock { font-size: 12px; flex-shrink: 0; }
.birth-attributes { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.birth-attributes > summary { color: var(--muted); cursor: pointer; min-height: 44px; display: list-item; font-size: 13px; line-height: 44px; }
.birth-attributes .character-attributes { margin-top: 6px; }
.birth-actions { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); padding-top: 20px; }
.birth-actions > p { color: var(--muted); font-size: 12px; }
.paper-page .birth-start { flex-shrink: 0; min-height: 48px; padding-inline: 20px; font-size: 15px; }

@media (max-width: 560px) {
  .paper-page-immersive { padding-top: 0; }
  .paper-top-immersive { min-height: 74px; margin-inline: -18px; padding: 9px 18px; gap: 8px; }
  .paper-top-immersive .paper-tools { gap: 0; }
  .paper-top-immersive .paper-tools button { padding-inline: 6px; }
  .paper-page-immersive .paper-main { padding-top: 24px; }
  .journey-identity-name { gap: 6px; }
  .journey-name { font-size: 17px; }
  .journey-identity-facts { column-gap: 7px; }
  dialog.paper-drawer { width: calc(100vw - 16px); max-width: calc(100vw - 16px); height: calc(100dvh - 16px); max-height: calc(100dvh - 16px); margin: 8px; }
  .paper-drawer .dialog-header { padding: 10px 18px; }
  .paper-drawer .dialog-body { padding: 20px 18px; }
  .paper-drawer .dialog-actions { padding: 12px 18px; }
  .character-facts, .character-inventory { column-gap: 16px; }
  .character-attributes { gap: 12px; }
}
@media (max-width: 460px) {
  .journey-block { font-size: 17px; }
  .journey-current h2, .birth-heading h2 { font-size: 25px; }
  .journey-choice { padding: 13px 14px; }
  .journey-consequence .journey-block { font-size: 15px; }
  .journey-consequence { padding-bottom: 18px; margin-bottom: 22px; }
  .birth-actions { align-items: stretch; flex-direction: column; gap: 12px; }
  .birth-actions > p { text-align: center; }
  .paper-page .birth-start { width: 100%; }
}
.legacy-rule-note { color: var(--muted); line-height: 1.7; }
[data-legacy-bridge] { white-space: normal; min-height: 44px; }
[data-legacy-bridge] .tiny { display: block; }

/* Live mode retains the reading width and the committed character display. */
.live-status { margin: 1.4rem 0; padding: 1rem; border: 1px solid currentColor; border-radius: .5rem; }

.title-content { width: 100%; max-width: 380px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 0 36px; text-align: center; }
.title-eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .25em; margin: 0 0 28px; }
.title-name { position: relative; color: var(--text); font: 500 58px/1.4 var(--serif); letter-spacing: .16em; padding-left: .16em; white-space: nowrap; }
.title-seal { position: absolute; right: -20px; top: -2px; writing-mode: vertical-rl; color: var(--red); border: 1px solid currentColor; padding: 5px 2px; font: 12px/1.2 var(--serif); letter-spacing: 2px; }
.title-prologue { font: 14px/2 var(--serif); color: var(--muted); letter-spacing: .1em; margin: 12px 0 36px; }
.title-menu { display: flex; flex-direction: column; width: 100%; max-width: 288px; gap: 10px; }
.title-option { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 7px; min-height: 79px; width: 100%; padding: 14px 16px; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 3px; }
.title-option-name { font: 20px/1.5 var(--serif); letter-spacing: .2em; padding-left: .2em; }
.title-option-note { font-size: 11px; line-height: 1.7; color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.title-option.is-primary { border-color: var(--line2); background: var(--panel); }
.title-option.is-primary .title-option-name { color: var(--jade-bright); }
.title-option:hover:not(:disabled) { border-color: var(--jade); background: var(--paper-hover); }
.title-option:disabled { color: var(--dim); border-color: transparent; background: transparent; cursor: default; }
.title-option:disabled .title-option-name { color: var(--dim); }
.title-switch { color: var(--muted); font-size: 12px; margin-top: 12px; min-height: 44px; padding: 8px 16px; }
.title-switch span { margin-left: 7px; }
.title-switch:hover { color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
.title-error { color: var(--red); font-size: 12px; line-height: 1.8; margin-top: 12px; }
.title-footer { display: flex; justify-content: space-between; width: min(100%,720px); gap: 24px; color: var(--dim); font-size: 11px; line-height: 1.8; padding-top: 8px; }
.menu-page-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); padding: 0 0 12px; }
.menu-page-header p { font: 17px/1.6 var(--serif); letter-spacing: 2px; }
.menu-page h2 { font: 28px/1.6 var(--serif); margin: 6px 0 20px; }
.menu-page .birth-kicker { color: var(--muted); }
.section-intro { color: var(--muted); line-height: 1.9; font-size: 14px; margin-bottom: 24px; }
.settings-section { padding: 25px 0; border-bottom: 1px solid var(--line); }
.settings-section h3 { font: 19px/1.6 var(--serif); margin-bottom: 12px; }
.settings-section > p { font-size: 14px; line-height: 1.9; color: var(--muted); }
.settings-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
.reading-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.reading-controls label { display: grid; gap: 10px; font-size: 14px; }
.reading-controls select, .live-birth select { min-width: 0; min-height: 44px; width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line2); padding: 10px 12px; border-radius: 4px; font: inherit; }
.reading-sample { padding: 16px; margin-top: 20px; background: var(--panel); font-family: var(--serif); }
.live-birth > label { display: block; margin: 20px 0 9px; font-size: 14px; }
.live-birth > input { width: 100%; min-height: 48px; padding: 12px; font: 17px var(--serif); }
.birth-preservation { color: var(--muted); font-size: 13px; margin: 28px 0 15px; }
.live-birth > .birth-start { width: 100%; }
.journey-list { display: grid; gap: 12px; margin-bottom: 22px; }
.journey-save { display: grid; gap: 9px; width: 100%; text-align: left; color: var(--text); border: 1px solid var(--line2); background: transparent; padding: 18px; border-radius: 4px; font-size: 13px; line-height: 1.7; }
.journey-save:hover { background: var(--paper-hover); border-color: var(--jade); }
.journey-save-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.journey-save-heading strong { font: 20px var(--serif); overflow-wrap: anywhere; }
.journey-save-tag { flex-shrink: 0; font-size: 11px; color: var(--jade); }
.journey-save-location { color: var(--muted); }
.journey-navigation { display: flex; justify-content: center; gap: 12px; margin-top: 30px; padding: 12px 0; border-top: 1px solid var(--line); background: var(--bg); }
.journey-navigation button { padding: 10px; min-height: 44px; font-size: 13px; color: var(--muted); }
.journey-navigation button:hover { color: var(--text); text-decoration: underline; text-underline-offset: 5px; }
.journey-navigation + .paper-footer { margin-top: 0; padding-top: 10px; border-top: 0; }
select:focus-visible { outline: 2px solid var(--jade); outline-offset: 3px; }

:root[data-theme='light'] { color-scheme: light; --bg:#faf8f2; --panel:#f6f3eb; --panel2:#efede5; --line:#dedbd2; --line2:#ccc8bd; --text:#302f2a; --muted:#68665e; --dim:#747168; --jade:#52644e; --jade-bright:#3c5038; --gold:#77613c; --red:#9a4336; --paper-hover:#efede5; --paper-selected:#e8ecdf; --paper-disabled:#f0eee8; --paper-selection:#dce4d2; --paper-backdrop:#292b2866; }
:root[data-theme='dark'] { color-scheme: dark; --bg:#1e211f; --panel:#252925; --panel2:#2c302b; --line:#3d423b; --line2:#54594f; --text:#e5e4db; --muted:#b8b8ac; --dim:#aaac9f; --jade:#b8c7a8; --jade-bright:#d1dcc2; --gold:#d1ba8d; --red:#eeaa98; --paper-hover:#30362d; --paper-selected:#343e30; --paper-disabled:#272b26; --paper-selection:#45543c; --paper-backdrop:#080b08b3; }
:root[data-text-size='large'] .journey-prose p, :root[data-text-size='large'] .journey-consequence p, :root[data-text-size='large'] .story-prose p, :root[data-text-size='large'] .journey-records p, :root[data-text-size='large'] .reading-sample { font-size: 21px; line-height: 2; }
@media (max-width:560px) {
  .title-shell { padding: 28px 24px 18px; }
  .title-content { padding-bottom: 20px; }
  .title-eyebrow { margin-bottom: 24px; font-size: 11px; }
  .title-name { font-size: 45px; letter-spacing: .12em; }
  .title-seal { right: -19px; font-size: 10px; }
  .title-prologue { font-size: 13px; margin-bottom: 28px; }
  .title-menu { max-width: 260px; }
  .title-option { min-height: 76px; }
  .title-landscape { height: 35%; inset-inline: -40%; }
  .reading-controls { gap: 12px; }
  .journey-navigation { gap: 4px; }
  .journey-navigation button { padding-inline: 8px; }
}
@media (max-height:640px) {
  .title-shell { padding-top: 18px; }
  .title-eyebrow { margin-bottom: 12px; }
  .title-prologue { margin-bottom: 14px; }
  .title-menu { gap: 4px; }
  .title-option { min-height: 68px; padding-block: 9px; }
  .title-content { padding-bottom: 8px; }
}
.live-status p { margin: .3rem 0 .7rem; }
.live-status .button, .live-toolbar .button { margin: .3rem .4rem .3rem 0; }
.live-toolbar { display: flex; flex-wrap: wrap; gap: .4rem; }
.birth #live-name, .birth #live-origin { display: block; box-sizing: border-box; width: 100%; max-width: 100%; min-height: 44px; margin: .5rem 0 1.3rem; padding: .6rem; font: inherit; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: .3rem; }
.live-status, .journey-choice-reason { overflow-wrap: anywhere; }

      "炉底并不是金光灿烂的仙种。那枚种子缩在一团焦根中，每次地脉震动，就抽出一点新绿去补裂缝。沈芷伸手时，它没有认出她是谁；陆槐的令牌也不能令它安静。当年谁说过谎，谁救过人，都不能替它撑住今天的土地。",
      "“留种，要有人照料，也要修好地脉。交给归衡宗，他们有炉有药，可这片谷就归他们做主。毁种泄掉余火，大家能走，药谷却不会再生。”沈芷说完，主动退开半步。“你帮我查过，我得让你听见三个答案。别到最后才告诉你，只许选我想要的。”"
    ]
  },
  "YG14": {
    "title": "三个人没有同一个愿望",
    "paragraphs": [
      "沈芷想把种埋回谷土；陆槐想把它送进宗门的稳火炉；温渡若在，会说自己只想以后没有孩子再学开这道闸。他们并没有因为真相揭开便变成一条心。你也不必假装存在一条让所有人都满意的路。",
      "你面前已经放好三样东西：谷民愿共守的名册、归衡宗接管的印契、一把能斩断主根的旧刀。沈芷最后问的是：“往后出了新的错，谁有权说停？”你可以把答案写进契里，也可以把刀拿起来。无论选哪样，八年里的查证、援手与失约都会随它留下。"
    ]
  },
  "YG15": {
    "title": "给活人留下的地方",
    "paragraphs": [
      "第一年的药圃仍有一半没有发芽。沈芷没有把你的名字挂在门口，只在义诊簿第一页写下三条规矩：取火有数，改渠留图，封谷须问住谷的人。她说写下来容易，下一次缺药时还能不能守住，才算真的做到了。",
      "若旧案公开，陆槐的签印留在档案里；若只做有限纠正，沈蘅终于洗去首责，却还有人不知道宗门做过什么。温渡是否站在新闸边，取决于你是否护住他的家。沈芷邀你喝了一碗苦茶：“不是谢你替我们过完这一生。以后有难，我们仍要自己开口。”",
      "归衡宗的稳火炉运进山谷，第一批工钱按时发下，谷民终于不必靠猜风向决定睡在哪里。沈芷在山外租下两间屋，继续替人看病。她承认安置比自己筹划得快，却把药庄发下的行医牌放在抽屉里，没有戴上。",
      "陆槐问你是否后悔。你望着谷门新添的验牌处，知道灵种活了，有些人往后却进不了自己的故乡。若你留下证据，账册会在民间继续传抄；若没有，石碑只写宗门平定地火的功劳。你完成了一次救援，也把“由谁定规矩”的问题留给后来的人。",
      "最后一缕绿从根部退去时，山下的人听见了一声很轻的裂响。没有新的大火，只有温热的灰落满谷口。沈芷在原来的药棚前站了一夜，第二天带走药簿，没有要求你发誓重建一座已经不能重建的谷。",
      "下游的新村没有灵泉，治病要花钱买药，活着也因此变得更辛苦。若你救过温渡一家，他们替村里开了第一条排水沟；若你失约，沟旁留着一段不肯与你相认的人情。有人说你毁了仙缘，也有人说你终于结束了一场延续十八年的灾难。两句话都有人活着说。"
    ]
  },
  "YG16": {
    "title": "此生还剩下许多年",
    "paragraphs": [
      "案子结了，日子没有跟着结束。你仍会饥饿、受伤，也仍想知道更高的山上有什么。每次回想谷底那枚灵种，你记起的未必是最后的选择，可能只是某个人说话时迟迟不肯松开的手。",
      "留下来的岁月可以拿去修行，也可以替新生活补上那些细小的缺口。若你回访相识的人，才会听见他们后来怎样；若你就此远行，关于药谷的消息便从书信、石碑和后人口中传来。没有人因你完成一件事便不再衰老。轮到最后一次收拾行囊时，你只能选择一份新传承，留给不会长成你模样的来者。"
    ]
  },
  "G2A01": {
    "title": "第五十七个病人",
    "paragraphs": [
      "医馆门口挂着前世留下的三条规矩，字已被反复描黑。守馆的人把一张新名单压在药簿上：今年的火额已经用尽，邻村却又送来五十七名病人。“我们没有忘记旧火。就是因为记得，才不知道现在该怎么办。”",
      "若沈芷仍活着，她让你先看病，不问你为何携着旧叶印；若她已经故去，继任者递来她留下的批注：规矩若只能阻止好人伸手，也要重写。你这一次面对的不是替前人复仇，而是决定前人立下的界线如何容纳后来的人。"
    ]
  },
  "G2A02": {
    "title": "配额之外的药",
    "paragraphs": [
      "库房里剩的药够救重症，不够给每个人开同样的方。守馆人说可以借宗门药债，也有人提议悄悄多抽一次地火，“只多这一次，不写进账”。你在旧页上看见前世留下的同一句理由，突然明白警告并不能替活人承受眼前的哭声。",
      "门外病人等的是药，院里药农等的是承诺。你可以付出自己的积蓄补外购，可以试着改出省火的方，也可以公开要求邻村共担下一年的停采。每一种办法都要有名字写在代价后面，不能再写一个含糊的“以后”。"
    ]
  },
  "G2A03": {
    "title": "谁有权写第四条",
    "paragraphs": [
      "药送出去后，院里召开第一次真正有人反对的公议。有人谢你，也有人问为何自己家排在后面。守馆人没有把争吵赶走，而是把旧药簿翻到空页：“前一位立规矩的人已经不能替我们回答。这一页由今天承担的人写。”",
      "你可以把应急取火与停采补偿写成公开办法，也可以接受宗门药债换稳定供应。若你只做了分诊，就把谁没有得到药、为什么没有也写下来。医馆并没有因为先人做对一次就永远做对；它能否承认新的不足，才是这条传承活着的地方。"
    ]
  },
  "G2B01": {
    "title": "故乡的验牌处",
    "paragraphs": [
      "谷口旧木桩换成石门，门后药田整齐得看不见火烧过的痕迹。一名本乡药工因没有续上工牌，被拦在母亲的坟外。执役的人递出宗门接管文书，印契末尾仍有前世留下的确认。",
      "药工没有请你毁掉药庄。家里靠这里的工钱吃饭，他只想每年能进去扫墓，也想有病时买得起自己种的药。若前世保住证据，他拿出一册民间抄本；若没有，他只知道旧库仍留着一个封存柜。新目标由此变成一件具体的事：改动这份旧契。"
    ]
  },
  "G2B02": {
    "title": "一纸旧约的背面",
    "paragraphs": [
      "管事说接管并非没有付出，旧炉、堤岸和安置屋都花过灵石。你若拿得出前世留存的证据，便能指出那不是可以随意收回的恩赐；没有证据，就得花钱调出旧柜，或替药工承担一次缺额的劳役。",
      "真正难谈的是下一条：宗门愿开放扫墓，却不肯让廉价药流出庄外。药工问你可不可以只谈已经能成的那一半。你在门边看见排队买药的人，明白完整解决与眼前落实不是同一回事。你可以继续争，也可以把边界说清，先救下一个确实办得到的权利。"
    ]
  },
  "G2B03": {
    "title": "两把钥匙",
    "paragraphs": [
      "契尾终于多了一行新字。若你争得供药，药工代表握住一把库钥，宗门握另一把，谁也不能独自开仓；若只争得祭扫，石门旁便开了一道每年清明无需验牌的小门。那不是同样的结果，也不必把较小的一项写成耻辱。",
      "老药工先去看了坟，没有向你跪拜。回来时他问，能否把这份新契也抄给外村看。前世的人曾用灵种换他们活下来，这一世的人再去争怎么活。谷地没有被一句翻案的话恢复原样，却确实少了一道只许别人替他们关上的门。"
    ]
  },
  "G2C01": {
    "title": "下游先到的病",
    "paragraphs": [
      "灰谷仍旧不长灵草，下游新村却已经有了炊烟和学堂。村民把药价写在井边，让每个来借水的人都能看见。他们不缺传说，缺的是一种不用远行半年也能买到的常用药。",
      "若温渡一家当年获救，排水沟旁留着一幅旧地形图；若他们受伤离散，沟道年年淤塞，村人先问你是不是又来许诺。没有人要求你找回已经焚尽的灵种。守药簿的人只问：“既然这块地养不出仙药，凡人的办法能不能也算一个办法？”"
    ]
  },
  "G2C02": {
    "title": "一块不认仙术的田",
    "paragraphs": [
      "地形图上圈出一片背风坡，土不灵，却能种寻常止咳草。争论随即变成谁家让地、谁来守水、第一年歉收由谁吃亏。你擅长的法门能省一道工，不能让这些问题自己消失。",
      "丹修可以改方减少灵材，体修能打通山石里的浅渠，剑修能为运苗的人开出短路。若你不愿用修行替他们做这一程，也可以出资请工。村人会把你付过的记下来，同样会把剩下要自己做的记下来；他们已有过一次把所有希望押在仙种上的岁月。"
    ]
  },
  "G2C03": {
    "title": "没有灵光的春天",
    "paragraphs": [
      "第一批药煎出来时，颜色比谷中旧药浑浊，见效也慢。守药簿的人把这两点清清楚楚写在方后，没把它说成失落仙方的重现。村里仍要外购重症所需的灵材，可寻常发热的人终于不用先卖掉一年的粮。",
      "灰谷那边没有突然返青。孩子问为什么先人不把灵种留下，大人便把那一年能够做到和做不到的事一并讲给他听。你在田边放下空药篓，知道这片地留下来的东西不会助谁一步登仙，却能让一个人多活到明年，再去作自己的选择。"
    ]
  },
  "G2A01B": {
    "title": "先念谁的名字",
    "paragraphs": [
      "新来的病人占满了院廊，药农却站在门外，说配额里的药也有自家一份。守馆人把名单分成重症与轻症，故意遮住村名。“若我们按病情来，就会有人觉得自己一年交的药白交了；若按谁先交过药来，有人今夜就等不到。”",
      "你先前听过的救人故事，在这里变成具体的两张床、一锅药。一个老人主动把位置让出来，又担心自己一走便再也排不回来。你能替他写下回诊保证，也可以先安抚守药的人。无论怎么排，必须把理由当着所有人说清。"
    ]
  },
  "G2A02B": {
    "title": "要不要把坏消息贴出来",
    "paragraphs": [
      "药终于够送出第一轮，新的难处却写在支出簿上：若偿还宗门的借药，明年可自由分配的药又会少一截。守馆人问你要不要等事情平息再公布，免得人以为这次救援只是换个时候亏欠他们。",
      "你走到院门前，看见原谷户与邻村人各贴了一张请愿纸。前者愿出药，但要知道上限；后者愿分担守田，却怕永远没有说话的位置。药锅冒着热气，恰好挡住门上旧规的最后一个字。你可以在这里补出一套共同决定的办法，也可以把判断继续留给馆主。"
    ]
  },
  "G2B01B": {
    "title": "谁记得那份工钱",
    "paragraphs": [
      "药工带你穿过新屋，屋顶都铺了瓦，墙上挂着按月发钱的木牌。“我爹逃出谷那年，靠这份钱买了第一袋米。”他说完，又指给你看母亲买药时留下的欠据。“可种药的人也买不起药，这话说出来，总有人当我们忘恩。”",
      "同行的人并不一致。有人只愿争一条祭扫小路，有人想让宗门退谷，还有人担心你把事情闹大后连工钱也停了。他们不是在等你替所有人发言，而是在问你愿意把谁的请求带到那扇门里。你最好把承诺讲得足够窄，窄到后来还能认账。"
    ]
  },
  "G2B02B": {
    "title": "印契不肯自己落款",
    "paragraphs": [
      "管事把修改过的契书送出来，愿意开放一条祭扫路，却把廉价药的数量写成“视岁收而定”。药工代表看到这里便不肯落印。“到了歉收年，他们一句话就能把药全收回去。”管事也直说，宗门不愿承担没有上限的供给。",
      "你面前的争议已经不是旧火由谁点起，而是新契在最坏的年份还剩多少效力。可以设一个小而确定的最低额，也可以先拿下祭扫权，等以后继续争。若你替双方担保，自己的押金会留在这里，不能刚赢得一句称赞便取回。"
    ]
  },
  "G2C01B": {
    "title": "旧承诺该找谁",
    "paragraphs": [
      "排水沟旁的人认出遗书上的旧道号，却没有认出你。他取出另一张纸，上面记着温家那年受伤后的药钱。若前世护送成功，纸上只有一句“人已平安”；若前世失约，后面密密写着几年的欠账。",
      "“我知道你不是写这封信的人。”他说，“我也没本事朝一个已经死去的人要钱。但每次有人拿他的名声来让我们相信下一次，我总得把这张纸拿出来。”你可以承认旧事而不替自己认一个凭空的身份，也可以替这段仍在损害活人的后果做一点实际补偿。"
    ]
  },
  "G2C02B": {
    "title": "收成还没长出来",
    "paragraphs": [
      "药苗下地后的第一个寒夜，山风掀走半片草棚。借地的人说再补棚，就得用原本准备种粮的木料；守园的人担心明年收成不足，自己白守一年。你可以留下钱承担这一次，也可以让参与的人共同约定收成、口粮和损失怎么分。",
      "没有灵种替这些药苗遮风，也没有一种功法能保证一年无灾。你若只把园子建好便走，它未必能活过下一季；你若包下所有亏损，又可能让后来的人只等下一个修士。院门边挂着空药篓，等你们决定谁先把它背起来。"
    ]
  }
};

    { id: 'leave', label: '不买，互道平安', description: '不花额外资源，继续行路。', result: '药商把筐换到另一肩，铃声渐远。' },
  ] },
  { id: 'mortal-abandoned-mine', worldId: 'mortal', title: '空矿的最后一脉', tag: '人间 · 探矿', body: '矿工已撤走，支架还在吱响。壁上露出灵石光泽，也许够付一次远行的费用。', choices: [
    { id: 'mine', label: '加固支架再开采', description: '额外花二年；成功率八成，得三十八灵石；失败损失二十气血。', cost: { years: 2 }, chance: 0.8, result: '支架撑到你收锤。你没有再向更深的裂缝追去。', effects: { spirit: 38 }, failure: { text: '碎石先落下，你及时逃出矿口，肩背却挨了重重一下。', effects: { hp: -20 } } },
    { id: 'leave', label: '封住入口', description: '不花额外资源，放弃开采。', result: '你把警示木板立正。光留在黑暗中，也未必是谁的损失。' },
  ] },
  { id: 'mortal-sparrow', worldId: 'mortal', title: '筑巢在剑匣上', tag: '人间 · 小憩', body: '你小憩醒来，麻雀已经在剑匣上搭了两根草。它看着你，像在等一场商量。', choices: [
    { id: 'wait', label: '多留一季护雏', description: '额外花一年，得十二修为与一点善名。', cost: { years: 1 }, result: '雏鸟飞走那天，你发现静坐也能听见自身经脉的潮声。', effects: { cultivation: 12, merit: 1 } },
    { id: 'leave', label: '把草巢移到树杈', description: '不花额外资源，轻轻离开。', result: '麻雀跟着你叫了几声，终于落回新枝。' },
  ] },
  { id: 'mortal-duel', worldId: 'mortal', title: '三招止争', tag: '人间 · 比试', body: '一名游侠拦在茶棚前，说要用三招辨明谁的剑理更对。茶棚主人只希望别打碎桌子。', requires: { minRealm: 1 }, choices: [
    { id: 'duel', label: '以木枝过招', description: '额外花一年；成功率七成，得回澜剑、十五灵石；失败损失二十五气血。', cost: { years: 1 }, chance: 0.7, result: '第三招你先护住了滚落的茶碗。游侠怔了怔，主动认输。', effects: { itemId: 'returning-edge', spirit: 15, renown: 2 }, failure: { text: '木枝折在掌中。你认下这一败，茶桌倒是完好无损。', effects: { hp: -25 } } },
    { id: 'leave', label: '请他喝茶，不争剑理', description: '不花额外资源，不参加比试。', result: '茶棚主人松了口气，给两人都续了水。' },
  ] },
  { id: 'mortal-mirror', worldId: 'mortal', title: '湖中第二个月亮', tag: '人间 · 灵物', body: '湖心有两轮月影，其中一轮始终不随水波动。撑船人说，别去捞天上的那轮。', requires: { minRealm: 2 }, choices: [
    { id: 'dive', label: '入湖寻不动的月', description: '额外花二年、消耗十五灵石，得到露华镜。', cost: { years: 2, spirit: 15 }, result: '你从淤泥中托出一面小镜。湖上终于只剩一轮月亮。', effects: { itemId: 'mirror-of-dew' } },
    { id: 'leave', label: '让月影留在湖里', description: '不花额外资源，乘舟离开。', result: '两轮月一前一后送你到岸边。' },
  ] },
  { id: 'mortal-winter-grain', worldId: 'mortal', title: '门前一斗粮', tag: '人间 · 取舍', body: '山寺的储粮刚好够到开春。门外来了一家避雪的人，住持望着空了一半的米缸没有说话。', choices: [
    { id: 'give', label: '捐灵石换过冬粮', description: '消耗十五灵石，得两份药材与三点善名。', cost: { spirit: 15 }, result: '春天，避雪人把自己找到的草药送回寺中。药并不名贵，却晒得极仔细。', effects: { herbs: 2, merit: 3 } },
    { id: 'leave', label: '为他们指向山下驿站', description: '不花额外资源，不动寺中存粮。', result: '你在地图上画清路程，再把纸递给他们。' },
  ] },
  { id: 'mortal-old-friend', worldId: 'mortal', title: '故人已老', tag: '人间 · 岁月', body: '曾与你同行的行脚人已经弯了背。他还记得当年的山路，只是走不到山口了。', requires: { minRealm: 2 }, choices: [
    { id: 'stay', label: '陪他重讲一遍旧路', description: '额外花二年，得二十二修为；时间属于这一世，不会换回他的青春。', cost: { years: 2 }, result: '他把你当年遗漏的半段笑话讲完。你终于不再急着替这场告别找一个仙法。', effects: { cultivation: 22, merit: 1 } },
    { id: 'leave', label: '留下地址，继续赶路', description: '不花额外资源，就此道别。', result: '他挥手时仍像年轻时候，只是手落得慢了些。' },
  ] },
  { id: 'nether-first-ferry', worldId: 'nether', title: '无人掌舵的渡船', tag: '幽冥 · 渡途', body: '船上坐满不知归处的影子。船桨旁刻着规矩：撑到对岸，船资自取，不得多拿。', choices: [
    { id: 'row', label: '替亡魂撑一程', description: '额外花二年，得二十八灵石与两点善名。', cost: { years: 2 }, result: '最后一个影子下船，向你认真行礼。你取了该取的船资。', effects: { spirit: 28, merit: 2 } },
    { id: 'leave', label: '沿岸另寻渡口', description: '不花额外资源，离开渡船。', result: '无声的水面把船轻轻推回岸边。' },
  ] },
  { id: 'nether-soul-loan', worldId: 'nether', title: '可借不可忘的魂火', tag: '因果 · 借债', body: '摆渡使递来一团温暖魂火：“能助你悟道。它不收今生利息，却会记住下一次轮回。”', requires: { notWorldFlag: 'soul-debt' }, choices: [
    { id: 'borrow', label: '借火，亲记债名', description: '额外花一年，得五十五修为、三十灵石；留下永久魂债，来世可偿还。', cost: { years: 1 }, result: '你在债簿上留下名号。魂火入心很暖，簿页却冷得像一场尚未到来的雪。', effects: { cultivation: 55, spirit: 30, worldFlag: 'soul-debt', flag: 'borrowed-soul' } },
    { id: 'leave', label: '不借未来的火', description: '不花额外资源，不产生魂债。', result: '摆渡使收回火焰，没有劝第二次。' },
  ] },
  { id: 'nether-debt-ledger', worldId: 'nether', title: '债簿上的旧名', tag: '前世 · 魂债', body: '前世借过的魂火在债簿上留下旧名。你此世面目不同，执簿人却把那页翻给你看：“没有惩你生来负债，只等你愿意了结。”', requires: { worldFlag: 'soul-debt', notFlag: 'borrowed-soul' }, choices: [
    { id: 'repay', label: '还清借来的温暖', description: '额外花三年、三十灵石，移除魂债，得到渡魂印与无债一身轻传承候选。', cost: { years: 3, spirit: 30 }, result: '旧名从纸上淡去。执簿人让你带走渡魂印，说自由不是忘记，而是不再被追索。', effects: { removeWorldFlag: 'soul-debt', itemId: 'ferry-seal', legacyId: 'debt-released', merit: 3 } },
    { id: 'leave', label: '记下欠款，稍后再来', description: '不花额外资源，魂债保留，可在下一世偿还。', result: '执簿人夹好那一页。债仍在，门也仍开着。' },
  ] },
  { id: 'nether-forgotten-letter', worldId: 'nether', title: '未寄出的家书', tag: '幽冥 · 托付', body: '亡魂把一封潮湿的信护在胸前。他知道家中人早已不在，仍想让那句话到达一块墓碑。', choices: [
    { id: 'deliver', label: '替他送到旧乡界碑', description: '额外花二年，得三份药材与二十五修为。', cost: { years: 2 }, result: '信在碑前化成轻灰。亡魂没有重逢谁，却终于肯走上下一段路。', effects: { herbs: 3, cultivation: 25, merit: 2 } },
    { id: 'leave', label: '把信交还他手中', description: '不花额外资源，不接下托付。', result: '他把信折好，又坐回那块不冷不热的石头上。' },
  ] },
  { id: 'nether-bone-bridge', worldId: 'nether', title: '白骨桥的缺口', tag: '幽冥 · 承重', body: '桥骨将断，成列游魂停在桥头。修桥不需要一场大战，需要一个愿意一直托着的人。', requires: { pathId: 'body' }, choices: [
    { id: 'hold', label: '托桥让亡魂过河', description: '额外花三年、损失三十气血，得托海式。', cost: { years: 3, hp: 30 }, result: '最后一缕魂影走过时，你才慢慢放低手臂。掌中留下了潮水的重量。', effects: { itemId: 'carrying-tide', merit: 3 } },
    { id: 'leave', label: '寻找另一座桥', description: '不花额外资源，不强撑缺口。', result: '你把断桥的位置标在路牌上，往上游走去。' },
  ] },
  { id: 'nether-sword-pool', worldId: 'nether', title: '沉剑潭', tag: '幽冥 · 剑意', body: '每把沉剑都曾许诺斩尽不平。潭水却很平，像在等人承认一把剑做不到所有的事。', requires: { pathId: 'sword' }, choices: [
    { id: 'draw', label: '拾起一把无主断剑', description: '额外花三年、消耗二十灵石，得焚星；燃寿仍会增加命损。', cost: { years: 3, spirit: 20 }, result: '你没有许诺斩尽一切，只答应每次出剑都知道为何。断剑在掌中化作一点星火。', effects: { itemId: 'burning-star', cultivation: 22 } },
    { id: 'leave', label: '让沉剑继续沉睡', description: '不花额外资源，离开水潭。', result: '你的剑影在潭面一闪，很快又平了。' },
  ] },
  { id: 'nether-dead-tree', worldId: 'nether', title: '不肯枯的树', tag: '幽冥 · 丹意', body: '枯树没有叶，树根却护着一枚还活着的芽。守林鬼说它每百年只肯松一次手。', requires: { pathId: 'alchemy' }, choices: [
    { id: 'nurture', label: '以药气温养根须', description: '额外花三年、五份药材，得枯木再荣。', cost: { years: 3, herbs: 5 }, result: '新芽终于长出一片叶。老根并未复活，但它完成了自己要做的事。', effects: { itemId: 'rebloom', cultivation: 25 } },
    { id: 'leave', label: '不扰这场等待', description: '不花额外资源，退回林外。', result: '一滴露水落在芽尖，亮了很久。' },
  ] },
  { id: 'nether-clock', worldId: 'nether', title: '停在昨日的钟', tag: '幽冥 · 命价', body: '钟匠能替你敲开一层心障，报酬不是灵石，而是你此后不能再用的几年。', choices: [
    { id: 'ring', label: '付四年命损听钟', description: '增加四年命损、不推进世界年份，得四十八修为。', cost: { lifeDamage: 4 }, result: '钟响一声，你看清了自己一直绕开的念头。发梢有四年悄然逝去。', effects: { cultivation: 48 } },
    { id: 'repair', label: '不敲钟，替钟匠修机轴', description: '额外花四年、消耗十二灵石，得三十二修为；这是历时劳作，会推进世界年份。', cost: { years: 4, spirit: 12 }, result: '你没有听见那一声捷径。机轴重新转动时，答案从四年的笨功夫里慢慢显现。', effects: { cultivation: 32 } },
    { id: 'leave', label: '拒绝交换', description: '不花额外资源，不损失寿元。', result: '钟匠把锤放下，昨日仍安静地悬着。' },
  ] },
  { id: 'nether-ghost-market', worldId: 'nether', title: '鬼市只卖旧物', tag: '幽冥 · 市集', body: '摊主戴着半张面具。架上的渡魂印明码标价，没有叫卖，也不接受来历不明的记忆。', choices: [
    { id: 'buy', label: '买下渡魂印', description: '消耗三十六灵石，获得渡魂印。', cost: { spirit: 36 }, result: '摊主在账册上写下两个字：两清。', effects: { itemId: 'ferry-seal' } },
    { id: 'leave', label: '看过便走', description: '不花额外资源，不与鬼市交易。', result: '面具后的眼睛没有追随你。' },
  ] },
  { id: 'nether-ink-river', worldId: 'nether', title: '墨河拾简', tag: '幽冥 · 残经', body: '河里漂着无人署名的竹简。墨水会侵蚀灵识，读得越多，越难分清谁的记忆。', choices: [
    { id: 'read', label: '只读三简便收手', description: '额外花二年；成功率七成，得四十五修为；失败损失二十八气血。', cost: { years: 2 }, chance: 0.7, result: '你把第四简推回河中。三句话已足以解开一处经脉的结。', effects: { cultivation: 45 }, failure: { text: '陌生的记忆猛然涌来，你咬破舌尖才退离河岸。', effects: { hp: -28 } } },
    { id: 'leave', label: '不读他人的旧事', description: '不花额外资源，远离墨河。', result: '竹简向下游去了，每一道字都有自己的重量。' },
  ] },
  { id: 'nether-red-herbs', worldId: 'nether', title: '彼岸药圃', tag: '幽冥 · 收成', body: '药圃主人是个记性极差的鬼，却记得每株草不能连根拔。她请你帮忙收这季的红叶。', choices: [
    { id: 'harvest', label: '按她的方法收叶', description: '额外花二年，得七份药材。', cost: { years: 2 }, result: '她忘记了你的名字，分药时却一点没有少。', effects: { herbs: 7 } },
    { id: 'leave', label: '谢过邀请', description: '不花额外资源，沿田埂离开。', result: '她挥挥手，下一刻又开始数第一畦药草。' },
  ] },
  { id: 'nether-judge', worldId: 'nether', title: '判官请你旁听', tag: '幽冥 · 是非', body: '两个亡魂争执一生的旧账。判官没有问你谁更可怜，而是问：你肯花多久听完两边的话？', requires: { minRealm: 3 }, choices: [
    { id: 'listen', label: '听完整卷证词', description: '额外花四年，得四十修为、二十灵石与两点善名。', cost: { years: 4 }, result: '你撤回了第一日的判断。判官点头：改口并不损伤道心。', effects: { cultivation: 40, spirit: 20, merit: 2 } },
    { id: 'leave', label: '不作仓促裁断', description: '不花额外资源，退出旁听席。', result: '判官没有把你的沉默记作任何一方的证词。' },
  ] },
  { id: 'nether-cold-flame', worldId: 'nether', title: '寒火锻骨', tag: '幽冥 · 炼体', body: '冥炉中的火没有热意，却会烧去每一道虚浮护体灵气。铸炉人说，痛也可以选择不承受。', requires: { minRealm: 3 }, choices: [
    { id: 'forge', label: '在寒炉守足三年', description: '额外花三年、损失四十气血、消耗二十五灵石，得无漏金身录。', cost: { years: 3, hp: 40, spirit: 25 }, result: '你走出炉时仍会受伤，只是知道如何把每一道伤接回身体里。', effects: { itemId: 'gold-body' } },
    { id: 'leave', label: '不入炉中', description: '不花额外资源，向铸炉人告辞。', result: '寒火安静燃烧，未把你的退步当作怯懦。' },
  ] },
  { id: 'nether-boat-bell', worldId: 'nether', title: '忘川雾灯', tag: '幽冥 · 休憩', body: '一间小屋专收迷路的生人。屋主先递一碗热汤，再问你记不记得自己的名字。', choices: [
    { id: 'stay', label: '整理记忆后再行', description: '额外花一年、消耗八灵石，恢复五十五气血。', cost: { years: 1, spirit: 8 }, result: '你把今生与旧梦各写一行。早晨推门，雾已经散开。', effects: { hp: 55 } },
    { id: 'leave', label: '报出姓名就此离开', description: '不花额外资源，继续旅途。', result: '屋主替你指了一条没有岔口的路。' },
  ] },
  { id: 'nether-empty-seat', worldId: 'nether', title: '轮回席上空一人', tag: '幽冥 · 放下', body: '席上空着一个位置，旁边摆着你从未见过却无端熟悉的碗。不是每个疑问都有可追认的前生。', choices: [
    { id: 'sit', label: '坐下喝完一碗茶', description: '额外花一年，得二十四修为。', cost: { years: 1 }, result: '你没有等到谁，却也没有白等。茶凉以后，你知道自己仍愿意回到路上。', effects: { cultivation: 24 } },
    { id: 'leave', label: '把空席留给来人', description: '不花额外资源，走向下一渡。', result: '杯沿热气缓缓升起，没有人喊你回头。' },
  ] },
  { id: 'celestial-gate-toll', worldId: 'celestial', title: '天门不收跪拜', tag: '天界 · 初见', body: '守门小吏把供桌移到一旁：“今日轮你讲一道能让三界都明白的规矩。说不出，也可先进去看看。”', choices: [
    { id: 'speak', label: '花三年辨清一条天规', description: '额外花三年，得五十修为与三点声望。', cost: { years: 3 }, result: '你说，付出的代价应当在选择前被人知道。小吏将这句话写进门榜。', effects: { cultivation: 50, renown: 3 } },
    { id: 'leave', label: '先看，再作判断', description: '不花额外资源，继续前行。', result: '小吏让开门道。天界也并非人人都急着给答案。' },
  ] },
  { id: 'celestial-sword-stars', worldId: 'celestial', title: '星河不肯让路', tag: '剑修 · 大成', body: '星河横在断阶前，一位老剑仙收剑静坐。他说，截流不该为了让所有人看见你的剑。', requires: { pathId: 'sword' }, choices: [
    { id: 'learn', label: '为后来的行人开阶', description: '额外花五年、消耗三十五灵石，得星河截流经。', cost: { years: 5, spirit: 35 }, result: '你截开一线星流，让石阶显出边缘。老剑仙终于起身，去做下一个过路人。', effects: { itemId: 'star-sword-art', renown: 3 } },

  narration(`断桥下，采药人${keeper(s)}的腿被木梁压住。她看见你，先叫你别踩右边那块松石。谷里的主事早已带着钱逃了，留下几个短工各自求生。`),
  narration(world(s, 'valley-seed') === 'destroyed' ? '另一条岔路通往旧药窖。那里只剩本季晒干的药和前人抄下的书。洪水不会因为你记得上辈子的路就退去。' : '另一条岔路通往药窖。青髓灵种、晒干的药材和谷医的书都在那里。救人和搬种都费工夫，你没有本事把两边都照顾周全。'),
  dialogue(keeper(s), '我怀里这册是完整的引气法。你若肯帮一把，就带走。先救命，别再替他们守财了。'),
], [
  choice('gate-rescue', '先去断桥下救人', '须在第二天结束前动手；再晚，涨水就会漫过木梁。药窖只能舍弃。', 'valley-rescue', '你伏低身子，试了试落脚处，朝桥下伸出手。', { requires: [before(2)] }),
  choice('gate-vault', '先去药窖找功法和药物', '往返要占去一天。若耽误救援，桥下的人不会一直等着。', 'valley-vault', '你沿着湿滑的石阶下到药窖，背后的呼喊渐渐被雨声盖住。', { requires: [before(2)], costs: { days: 1 }, effects: { lifeFacts: { 'vault-visited': true } } }),
  choice('gate-withdraw', '记住水势，立刻撤出', '这一趟没有高额报酬，但活着还有别的学法机会。', 'valley-aftermath', '你带回了谷口被冲断的消息。几个后来者因此没有再进山。', { costs: { days: 1 }, effects: { worldFacts: world(s, 'valley-seed') === 'destroyed' ? {} : { 'valley-seed': 'destroyed' }, deed: '在药谷封山前带回险情' } }),
]);

definitions['valley-rescue'] = s => {
  const saved = { items: { manual: 1, herb: 1, stones: 1 }, lifeFacts: { 'valley-rescued': true }, worldFacts: { 'valley-seed': 'destroyed' }, deed: `从断桥下救出${keeper(s)}` };
  return scene('valley-rescue', '先把人拉上来', '断桥下', '趁水还未涨满，救出采药人', [
    narration(`${keeper(s)}把药篓塞进你怀里，自己却已站不起来。木梁每晃一次，她的脸就白一分。你只有凡人的力气，必须找个切实能用的办法。`),
    narration(world(s, 'valley-seed') === 'destroyed' ? '远处药窖传来闷响。你明白，选了这里，就来不及再搬本季的药材。她的手仍紧紧抓着木梁，指节已经发白。' : '远处药窖传来闷响。你明白，选了这里，就来不及再搬灵种。她的手仍紧紧抓着木梁，指节已经发白。'),
  ], [
    choice('rescue-rope', '用借来的绳索卸开木梁', '准备好的绳索能分担重量，保住伤药，也能避免你自己受伤。', 'valley-escape', `你把绳子绕过老树，一寸寸吊起木梁。${keeper(s)}爬上岸，将干燥的功法交给了你。山谷深处，药窖终于塌进水中。`, { requires: [needFact('valley-rope'), before(2)], costs: { days: 1 }, effects: saved }),
    choice('rescue-medicine', '先止住她的血，再一起挪梁', '用掉随身的伤药，换她清醒配合；这是最稳妥的徒手办法。', 'valley-escape', `药粉压住了血。你们趁水流间歇合力移开木梁。${keeper(s)}活着上了岸，药窖却已救不回来。`, { requires: [before(2)], costs: { days: 1, items: { medicine: 1 } }, effects: saved }),
    choice('rescue-barehands', '拿自己的肩背顶住木梁', '一定会受伤。不用绳索、不用伤药，便要拿身体承受木梁的重量。', 'valley-escape', `木刺划开肩背，你仍撑到了她脱身。${keeper(s)}把功法塞进你衣内，说这不是恩赏，是她欠你的报酬。药窖的灯已经灭了。`, { requires: [before(2), injuryAtMost(1)], costs: { days: 1 }, effects: { ...saved, injury: hurt(s) } }),
  ]);
};

definitions['valley-vault'] = s => {
  const destroyed = world(s, 'valley-seed') === 'destroyed';
  return scene('valley-vault', destroyed ? '旧药窖里的新货' : '药窖最后一盏灯', '谷底药窖', '只拿自己能带走的东西', [
    narration(destroyed ? '石台上的根穴早已空了，连当年冲断的沟槽都被泥沙填平。今年寄存在这里的是普通灵草。你找到一只新药工的木箱，箱中压着一部完整功法。' : '石台上的青髓灵种已经露根，根下积着一点乳白药露。旁边是一部裹了油布的入门功法。要救活灵种，得把石盆拖到高处；只取书，转身就能走。'),
    narration('账页记着多年拖欠的工钱，也记着未经辨认便混卖的毒草。你终于明白谷医为什么宁愿冒雨逃走。那些旧事说明这里危险，却不会替你解决眼前的涨水。'),
  ], [
    destroyed
      ? choice('vault-dry-herbs', '背起药箱，带走干药和功法', '没有旧灵种可以再取；这批新药足够你起步。', 'valley-escape', '你从屋梁上拖下药箱，留下搬不动的湿货，爬上了高坡。', { requires: [before(3)], effects: { items: { manual: 1, herb: 2 }, lifeFacts: { 'valley-cargo': true }, injury: hurt(s) } })
      : choice('vault-save-root', '拖走灵种，只取根下现成的药露', '需要尚余一天，也一定会拉伤身体。桥下的人将错过救援。', 'valley-escape', '你把石盆拖上高坡，将灵种托付给逃出来的药工，只留下他们分给你的药露和抄本。断桥方向已没有呼喊。', { requires: [before(2), injuryAtMost(1)], costs: { days: 1 }, effects: { items: { manual: 1, essence: 1, herb: 1 }, injury: hurt(s), lifeFacts: { 'valley-cargo': true }, worldFacts: { 'valley-seed': 'saved' }, deed: '保住青髓灵种，却错过了断桥救援' } }),
    choice('vault-book-only', '只取功法，马上撤出', destroyed ? '不再为财物停留；无人搬走的这批新药会被洪水吞没。' : '不再为财物停留；无人搬走的灵种和药材会被洪水吞没。', 'valley-escape', '你把油布抄本贴身收好。身后石壁裂开，水声盖过了所有旧账。', { effects: { items: { manual: 1 }, worldFacts: { 'valley-seed': 'destroyed' }, lifeFacts: { 'valley-cargo': true } } }),
    choice('vault-go-rescue', '放下药箱，回断桥救人', '只要还在第二天，就仍有救人的余地；药窖里的东西都要舍弃。', 'valley-rescue', '你把木箱放回高架，掉头奔向断桥。', { requires: [before(2)], effects: { worldFacts: { 'valley-seed': 'destroyed' } } }),
  ]);
};

definitions['valley-escape'] = s => scene('valley-escape', '雨里下山', '药谷外坡', '活着离开这三日险地', [
  narration(fact(s, 'valley-rescued') ? `${keeper(s)}扶着你的肩，走几步就要歇一歇。她不是什么能挥手治伤的高人，只是比你早学了几年引气。泥水一样会冻僵她的手。` : '药谷的人已各自散去。背上的书和药都有分量，你第一次明白，拿到机缘以后，还得有命把它带出山。'),
  narration('山脚升起了炊烟。再往前走，就离开这场以天计的危险；往后的修行，却要以年去熬。'),
], [
  choice('escape-long-path', '走山民指过的高坡', '危险的谷道已经在身后。再花一天走山外高坡，伤者和行囊都能保住。', 'valley-aftermath', '你沿着山外高坡又走了一日，终于看见村口的灯。热粥很稀，你却喝得一滴不剩。村医查看过你的身体，另留了一包药以备不时之需。', { costs: { days: 1 }, effects: { items: { medicine: 1 }, lifeFacts: { 'valley-safe-exit': true } } }),
  choice('escape-short-path', s.life.injury >= 2 ? '从急流中抄近道（必死）' : '涉过急流抄近道（会受伤）', s.life.injury >= 2 ? '伤势已让你站不稳；这个水深下去，就没有力气回来。' : '不用再在山中过夜，但石底暗流一定会让你添伤，背上的药也会湿掉。', s.life.injury >= 2 ? 'ended' : 'valley-aftermath', s.life.injury >= 2 ? '水撞在腿上时，你已来不及抓住岸边。油布里的功法没有散，人却再没走出药谷。' : '你拖着湿透的衣衫爬上岸，腿上又添一道口子。捷径确实近，只是并不便宜。', s.life.injury >= 2 ? { ending: 'battle', endingTitle: '急流带走的少年', achievement: '曾摸到入门的机会，却没能带它走出药谷。', lesson: '伤重时，准备好的安全路比抢半日更重要。' } : { effects: { injury: hurt(s) } }),
]);

definitions['valley-aftermath'] = s => scene('valley-aftermath', '报酬与一部薄书', '芦村药棚', '把求仙的念头变成能开始的日子', [
  narration(fact(s, 'valley-rescued') ? `${keeper(s)}伤好一点后，替你看过功法，一页都不缺。她答应引你去见山外的启蒙师傅，但说，收留不是包你成仙。` : item(s, 'manual') ? '避雨的老药工替你翻过抄本：这部书是完整的，写得也很朴实。它没有能一夜成仙的秘诀，只教人认脉、调息、日复一日练习。' : '你没从药谷拿到仙物，但带回险情的人一样有饭吃。药棚的老师傅说，肯做满一年，他愿给你工钱，再抄一部完整功法。'),
  narration('谷主逃往哪里，不再是你眼下能管的事。母亲等着药，你也必须决定，要用多少年去试那条没人保证的路。'),
], [
  item(s, 'manual')
    ? choice('aftermath-take-road', '拿着完整功法，去见师傅', '先安排家中生活，再用几年真正入门。', 'village-farewell', '你把工钱和药分成两份。一份留在家，一份随自己上路。', { costs: { days: 7 }, effects: { items: { stones: 1, herb: 1 } } })
    : choice('aftermath-earn-manual', '做一年药工，换完整功法', '这一年是劳动，不会凭工龄得到修为。', 'village-farewell', '你搬柴、筛药、送病人回家。一年后，老师傅把抄好的全卷和约定的工钱一起交给了你。', { costs: { years: 1 }, effects: { items: { manual: 1, stones: 2, herb: 2 } } }),
  choice('aftermath-go-home', '领工钱回家，先过凡人的日子', '你可以放下这次求仙，不必为已经付出的代价继续冒险。', 'mortal-return', item(s, 'manual') ? '你把薄书包好，收在家中梁上。眼下，先把这个冬天过好。' : '你收好行囊，把工钱交给家里。眼下，先把这个冬天过好。', { effects: { items: { stones: 2 } } }),
]);

definitions['market-gate'] = s => scene('market-gate', '谁肯教一个穷学徒', '青石镇药市', '找到真实的报酬和完整功法', [
  narration('药市上挂着许多“仙家秘本”的招牌，翻开却大多缺页。你问过几家，才在街尾找到一个肯把价钱说清楚的药师：做满一年杂务，给三块灵石和一部完整入门书。'),
  dialogue('药师', '识字不等于会练。你做事若肯问清楚，我就肯把每一页讲清楚。'),
  narration(world(s, 'ruins-school') ? '镇上的蒙学还在教前人留下的草木图。这里的人因此更看重来历清楚的书，不肯只凭“秘传”二字收钱。' : '窗内的炉火很旺。你仍然穷，却终于看见了一条不用押命的门路。'),
], [
  choice('market-try-work', '进去做一天试工', '先看看这位药师是否说话算数。', 'market-job', '你挑出混在止血草里的毒叶。药师没有夸你，只把那一味重新讲了一遍。', { costs: { days: 1 } }),
  choice('market-send-cargo', '去渡口替药师送一趟货', '先做一段短工，再向行客打听学法门路。', 'ferry-gate', '你背起封好的药包，沿石板路走向白沙渡。', { costs: { days: 1 } }),
]);

definitions['market-job'] = s => scene('market-job', '一年工钱的价码', '药铺后院', '换到可以照着练的全卷', [
  narration('试工过后，药师取出真正的书让你逐页看。字不华美，脉图却清楚。他说，也可以用你那包难得的家传伤药换书，只是以后出门就少一份保命的东西。'),
  narration('你不再问有没有更快成仙的办法，而是问，做满一年是否确实给工钱。药师写下数目，你也记在心里。'),
], [
  choice('market-year-work', '做满一年，连本带工钱一起拿', '用时间换足第一趟远行的盘缠。', 'market-deal', '四季过去，你已能认出大半常用药。最后一天，药师逐页核对抄本，把三块灵石放在书上。', { costs: { years: 1 }, effects: { items: { manual: 1, stones: 3, herb: 1 }, heal: 1 } }),
  choice('market-trade-medicine', '用随身伤药换完整功法', '省下一年工期，却失去现成的疗伤药和工钱。', 'market-deal', '药师验过药性，收下药包，把全卷交给了你。你回到街上时，腰间比来时更轻。', { costs: { items: { medicine: 1 } }, effects: { items: { manual: 1 } } }),
]);

definitions['market-deal'] = s => scene('market-deal', '钱袋旁的借条', '药铺门前', '决定带着怎样的负担离开小镇', [
  narration('一个掮客看见你拿了功法，便愿意借四块灵石，还送一张护身符。他说得坦白：以后回来要还三块；他看重的是你有机会替他办事。便宜并非没有缘故。'),
  dialogue('药师', '穷一点可以慢慢走。欠了人情，也未必就坏，只要你别把它忘了。'),
], [
  choice('market-travel-light', '谢过借款，只拿自己挣的', '盘缠少些，往后每一步的去留都由自己决定。', 'village-farewell', '药师塞给你两把灵草，说穷学徒出门，总得有个能换饭的东西。', { costs: { days: 7 }, effects: { items: { herb: 2 } } }),
  choice('market-accept-debt', '借灵石和护身符，记住这笔债', '得到眼下的行装；回到镇上时，须用灵石或劳动偿还。', 'village-farewell', '你收好四块灵石和护身符，也把三块的欠款写在功法封底。', { costs: { days: 7 }, effects: { items: { stones: 4, talisman: 1 }, lifeFacts: { 'market-debt': true } } }),
]);

definitions['ferry-gate'] = s => scene('ferry-gate', '出船以前', '白沙渡船坞', '把一船药货平安送过江', [
  narration('船主说，江东的老修士正等这批药。他答应指点送货的少年，但船主只管船钱，不肯替你保证仙缘。你看见主缆已经起毛，船舱里还进着水。'),
  narration('天边有暗云。现在修船会误一天，直接出发则能省工；到了江心，差别就不是说说而已。'),
], [
  choice('ferry-mend', '留一天换缆、堵漏', '准备能让风浪来时有可用的船，不必靠运气。', 'ferry-storm', '你和老船工换了两道新缆，用木楔封住漏口。翌日启航，船身稳了许多。', { costs: { days: 1 }, effects: { lifeFacts: { 'ferry-rigged': true } } }),
  choice('ferry-hurry', '跟着船主立即出发', '旧缆和漏口都还在；遇浪时，只能用药救人或舍货保命。', 'ferry-storm', '船离开码头时很快。江心的风却比岸上大得多。', {}),
]);

definitions['ferry-storm'] = s => scene('ferry-storm', '浪头打上船舷', '江心', '在风浪里保住人命', [
  narration('半夜，浪头打断了一根篙。掌舵的船工撞在舱壁上，额头流血。药箱向倾斜的一侧滑去，你只能先做一件事。'),
  narration(fact(s, 'ferry-rigged') ? '新缆仍绷得住，补好的船舱也没有进水。你之前做的笨功夫，此时给了你空出手的余地。' : '旧缆正在一股股断开。船舱的漏水已经没过脚踝，强留全部货物会把人也拖下去。'),
], [
  choice('ferry-use-rigging', '借新缆稳住船，救起船工', '只有出发前修过船，才能同时保人和药箱。', 'ferry-landing', '你用新缆固定药箱，和醒来的船工一起撑过最急的浪。天亮后，人和货都上了东岸。', { requires: [needFact('ferry-rigged')], costs: { days: 1 }, effects: { items: { stones: 2 }, lifeFacts: { 'ferry-delivered': true }, deed: '在江心风浪中保住药船' } }),
  choice('ferry-save-pilot', '给船工止血，请他带船入支汊', '消耗伤药换回熟悉水路的人；药箱仍能送到。', 'ferry-landing', '船工醒来后指了一道看似不能通行的芦苇口。药船擦着岸挤进去，终于避开了浪头。', { costs: { days: 1, items: { medicine: 1 } }, effects: { items: { stones: 1 }, lifeFacts: { 'ferry-delivered': true } } }),
  choice('ferry-drop-cargo', '推货减重，先把船上人带回岸边', '放弃报酬，不死守已经保不住的货。搬货时会受伤。', 'ferry-landing', '几个药箱沉进黑水。船终于浮了起来，你手上伤口很深，却听见了同船人的呼吸。', { costs: { days: 2 }, effects: { injury: hurt(s), lifeFacts: { 'ferry-delivered': false }, deed: '舍弃药货，使一船人活着靠岸' } }),
]);

definitions['ferry-landing'] = s => scene('ferry-landing', '东岸的老修士', '江东小院', '用已经做过的事，换一个真正的开始', [
  narration(fact(s, 'ferry-delivered') ? '老修士拆开药箱，闻过药香才松了口气。他的腿受过旧伤，已经不能远行，最怕有人为了求他指点便许下做不到的事。' : '你把落水的经过一五一十讲完。老修士没有追问沉掉的货，只让你先伸手看伤。他说，亏损已是亏损，没必要再赔一条命。'),
  dialogue('老修士', '这部引气法我会抄全。救船有救船的报酬，学法有学法的苦，别把两件事混在一起。'),
], [
  choice('ferry-claim-book', '领送药的报酬，带全卷离开', '只有药货平安送到，才能直接领走这份报酬。', 'village-farewell', '老修士替你讲清最难认的几处脉图，又送了两把灵草。你向他行礼，踏上归路。', { requires: [needFact('ferry-delivered')], costs: { days: 7 }, effects: { items: { manual: 1, herb: 2 }, heal: 1 } }),

]);

definitions['village-farewell'] = s => scene('village-farewell', '出门前的一顿饭', '故乡', '安顿牵挂的人，然后认真求学', [
  narration(s.world.generation === 1 ? '母亲把你带回的书翻了又翻，她并不识字，只看见书页没有缺。你说想试着修行，她沉默了半晌，给你添了一碗饭。' : '这一世的家人并不认识你记忆中的那些名字。他们只知道你挣到了书，也知道你还年轻。他们为你备了一顿平常的饭，让你自己决定以后往哪里走。'),
  narration('村医说，一把合用的灵草就能让家中病人的冬天好过些，但治不了生老病死。你第一次把这两件事分清：眼前能做的照顾，和仍很遥远的长生。'),
