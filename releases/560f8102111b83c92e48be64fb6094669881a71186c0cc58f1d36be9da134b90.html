.live-status p { margin: .3rem 0 .7rem; }
.live-status .button, .live-toolbar .button { margin: .3rem .4rem .3rem 0; }
.live-toolbar { display: flex; flex-wrap: wrap; gap: .4rem; }
.birth #live-name, .birth #live-origin { display: block; box-sizing: border-box; width: 100%; max-width: 100%; min-height: 44px; margin: .5rem 0 1.3rem; padding: .6rem; font: inherit; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: .3rem; }
.live-status, .journey-choice-reason { overflow-wrap: anywhere; }
.live-intro { margin-block: 1rem; }
.live-birth-greeting { margin: 10px 0 28px; font: 21px/1.9 var(--serif); }
.live-birth form > label { display: block; margin: 18px 0 8px; font-size: 14px; }
.live-birth form > .birth-start { width: 100%; margin-top: 16px; }
.live-turn-feedback { margin: 0 0 8px; font: 15px/1.8 var(--serif); color: var(--muted); overflow-wrap: anywhere; }
.live-turn-changes, .live-turn-check { margin: 6px 0; font: 13px/1.8 var(--sans); color: var(--muted); overflow-wrap: anywhere; }
.live-turn-check { color: var(--jade); margin-bottom: 18px; }
.live-turn-state { border-block: 1px solid var(--line); margin-top: 24px; padding-block: 9px; color: var(--muted); font-size: 13px; }
.live-turn-state summary { cursor: pointer; min-height: 36px; line-height: 2.5; }
.live-turn-state summary > span { margin-right: 15px; }
.live-turn-state summary .live-state-hint { font-size: 12px; color: var(--dim); }
.live-turn-state dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; margin: 10px 0; }
.live-turn-state dl > div { min-width: 0; }
.live-turn-state dt { color: var(--dim); font-size: 12px; }
.live-turn-state dd { margin: 3px 0 0; color: var(--text); overflow-wrap: anywhere; }
.live-turn-state dl > div:last-child { grid-column: 1 / -1; }
.live-choice-number { font-variant-numeric: tabular-nums; }
.live-custom-action { margin-top: 10px; }
.live-custom-action > .journey-choice:disabled { color: var(--text); background: transparent; border: 1px solid var(--line2); }
.live-custom-action form { margin-top: 14px; }
.live-custom-action label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
.live-custom-action textarea { display: block; box-sizing: border-box; width: 100%; min-height: 88px; resize: vertical; padding: 12px; border: 1px solid var(--line2); border-radius: 4px; color: var(--text); background: transparent; font: 16px/1.8 var(--serif); }
.live-custom-action textarea:focus { outline: 2px solid var(--jade); outline-offset: 2px; }
.live-custom-action form .button { margin-top: 10px; }
.live-action-error { color: var(--red); font-size: 13px; line-height: 1.7; margin: 8px 0; }
.live-reincarnation { margin-top: 24px; }
.live-reincarnation h3 { font: 23px/1.5 var(--serif); }
.live-epitaph { margin: 18px 0; padding-left: 16px; border-left: 2px solid var(--line2); font: 17px/1.8 var(--serif); color: var(--muted); }
.live-causal-points { font-size: 14px; line-height: 1.9; color: var(--muted); }
.live-reward-list { display: grid; gap: 10px; margin: 16px 0; }
.live-reward-list .journey-choice[aria-pressed="true"] { border-color: var(--jade); background: var(--paper-hover); }
.live-reward-name { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.live-reward-description { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }
.live-reincarnation > .button { min-height: 44px; width: 100%; margin-top: 12px; }

/* The title scene keeps its palette independently of reading preferences. */
.initial-loading { min-height: 100svh; background: #101d24; color: #d9d1be; }
.initial-loading .seal { background: #15242d; border: 1px solid #d8bd8970; color: #dfc495; }
.title-shell {
  --title-ivory: #f1eddf;
  --title-muted: #b0b9b7;
  --title-gold: #dfc495;
  --scene-x: 0px;
  --scene-y: 0px;
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-rows: auto 1fr auto;
  justify-items: stretch;
  align-items: stretch;
  min-height: 100svh;
  padding: 28px clamp(28px, 4.2vw, 80px) 20px;
  padding-top: max(28px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  overflow: hidden;
  color: var(--title-ivory);
  background: #101d24;

  const extras={ruleRelation:['entityId','value'],receipt:['receipt'],entity:['entity','status'],fact:['entityId','text'],relationship:['entityId','text'],promise:['entityId','text','status'],clue:['entityId','text','status'],death:['entityId','text'],turn:['text','entityIds'],summary:['text','references']};
  if(!Object.hasOwn(extras,record.kind))fail('MEMORY_RECORD_INVALID');
  exactKeys(record,[...common,...extras[record.kind]]);idField(record.id);whole(record.turnId);
  if(record.runId!==state.runId||record.turnId>state.turnId)fail('MEMORY_RECORD_INVALID');
  if(record.kind==='ruleRelation'){
    idField(record.entityId);if(record.source!=='rules'||!Number.isInteger(record.value)||record.value < -100||record.value > 100)fail('MEMORY_RECORD_INVALID');
  } else if(record.kind==='receipt'){if(record.source!=='rules')fail('MEMORY_RECORD_INVALID');validateReceipt(record.receipt);}
  else if(record.kind==='entity'){
    exactKeys(record.entity,['id','name','kind'],['experience']);if(record.entity.experience&&!isExperienceLife(state.life))fail('MEMORY_RECORD_INVALID');validateEntities([record.entity]);if(!['rules','narrative'].includes(record.source)||!['unknown','alive','dead'].includes(record.status)||record.entity.kind!=='person'&&record.status!=='unknown')fail('MEMORY_RECORD_INVALID');
  } else {
    textField(record.text,500);
    if(record.kind==='summary'){
      if(record.source!=='derived'||!Array.isArray(record.references)||record.references.length>24)fail('MEMORY_RECORD_INVALID');record.references.forEach(idField);
    } else {
      if(!['narrative','rules'].includes(record.source)||record.kind!=='fact'&&record.source!=='narrative')fail('MEMORY_RECORD_INVALID');
      if(record.kind==='turn'){if(!Array.isArray(record.entityIds)||record.entityIds.length>24)fail('MEMORY_RECORD_INVALID');record.entityIds.forEach(idField);}
      else idField(record.entityId);
      if(record.kind==='promise'&&!['open','resolved','broken'].includes(record.status)||record.kind==='clue'&&!['open','resolved'].includes(record.status))fail('MEMORY_RECORD_INVALID');
    }
  }
}
function latestRecords(records,state) {
  const rows=new Map();
  for(const row of records){validateRecord(row,state);const old=rows.get(row.id);
    if(old){
      if(old.kind!==row.kind||old.source!==row.source)fail('MEMORY_RECORD_CONFLICT');
      // Only these record types have an explicit mutable payload. Re-indexing an
      // identical immutable fact at another wrapper turn cannot replace its data.
      if(!['entity','promise','clue','summary','ruleRelation'].includes(row.kind)){
        const payload=value=>Object.fromEntries(Object.entries(value).filter(([key])=>key!=='turnId'));
        if(!equal(payload(old),payload(row)))fail('MEMORY_RECORD_CONFLICT');
      }
      if(['clue','promise','ruleRelation'].includes(row.kind)&&(old.entityId!==row.entityId||old.text!==row.text))fail('MEMORY_RECORD_CONFLICT');
      if(row.kind==='entity'&&(old.entity.id!==row.entity.id||old.entity.name!==row.entity.name||old.entity.kind!==row.entity.kind))fail('MEMORY_RECORD_CONFLICT');
      if(old.turnId===row.turnId&&!equal(old,row))fail('MEMORY_RECORD_CONFLICT');
      const earlier=old.turnId<row.turnId?old:row,later=old.turnId<row.turnId?row:old;
      if(['clue','promise'].includes(row.kind)&&earlier.status!=='open'&&later.status!==earlier.status)fail('MEMORY_RECORD_CONFLICT');
      if(row.kind==='entity'&&earlier.entity.experience&&!equal(earlier.entity.experience,later.entity.experience))fail('MEMORY_RECORD_CONFLICT');
      if(row.kind==='entity'&&earlier.status==='dead'&&later.status!=='dead')fail('MEMORY_RECORD_CONFLICT');
    }
    if(!old||old.turnId<row.turnId)rows.set(row.id,copy(row));
  }
  for(const row of rows.values())if(row.kind==='summary'&&row.references.some(id=>!rows.has(id)))fail('MEMORY_REFERENCE_MISSING');
  return [...rows.values()].sort((a,b)=>b.turnId-a.turnId||(a.id<b.id?-1:a.id>b.id?1:0));
}

 function sceneTurnRecord(scene,{runId,turnId,action=null}) {
  idField(runId);whole(turnId,1);validateStructure(scene);
  const prefix=Array.from('地点：'+scene.location+(action?'；刚才选择：'+action.label:'')+'\n').slice(0,120).join('');
  const tail=[];let length=prefix.length;
  for(const character of Array.from(scene.blocks.map(block=>block.text).join('\n')).reverse()){
    if(length+character.length>500)break;tail.unshift(character);length+=character.length;
  }
  const ended=scene.id==='r:'+sha256(runId).slice(0,16)+':t'+turnId+':s:closed'&&action?.intent==='interact'&&['decline','leave'].includes(action.approach);
  return {id:'turn:'+turnId,runId,turnId,source:'narrative',kind:'turn',text:(prefix+tail.join('')).trim(),entityIds:ended&&scene.entities.some(entity=>entity.id===action.targetId)?[action.targetId]:[]};
}

 function buildStoryContext(state,pending,relatedRecords=[],options={}) {
  inspect(options);
  exactKeys(options,[],['selection','openTotal','continuity']);
  if(options.continuity!==undefined&&typeof options.continuity!=='boolean')fail('STORY_CONTEXT_INVALID');
  const continuity=options.continuity!==false;
  const selecting=options.selection==='relevance-v1';
  if((options.selection!==undefined||options.openTotal!==undefined) && (!selecting || !Number.isSafeInteger(options.openTotal) || options.openTotal<0))fail('STORY_CONTEXT_INVALID');
  inspect(state);inspect(pending);inspect(relatedRecords,256*1024);

    fixed=pending.kind==='opening'?prepareOpening(state,{requestId:pending.identity.requestId}):pending.kind==='choice'?prepareRecordedChoice(state,pending):null;
    if(!fixed||!equal(fixed,pending))fail('ACTION_RECEIPT_MISMATCH');
  } catch { fail('ACTION_RECEIPT_MISMATCH'); }
  if(fixed.receipt.death)fail('DEATH_REQUIRES_LOCAL_SETTLEMENT');
  const current=continuity&&state.currentScene?sceneTurnRecord(state.currentScene,{runId:state.runId,turnId:state.turnId,action:state.lastReceipt?.action}):null;
  const records=latestRecords([...relatedRecords,...(current?[current]:[])],state),entities=new Map();

    const old=entities.get(entity.id),next={id:entity.id,name:entity.name,kind:entity.kind,status,...(entity.experience?{experience:copy(entity.experience)}:{})};

  if(!selecting&&entities.size>24)fail('MEMORY_CONTEXT_TOO_LARGE');

  const result={schemaVersion:1,phase:fixed.kind,identity:copy(fixed.identity),namespace:namespace(state.runId),receipt:copy(fixed.receipt),life:copy(fixed.nextLife),entities:[...entities.values()],memory:{facts,promises,clues,recent:records.filter(r=>r.kind==='turn').slice(0,4),summaries:records.filter(r=>r.kind==='summary').slice(0,2)},references:[],previousScene:state.currentScene?{id:state.currentScene.id,blocksHash:sha256(canonicalStringify(state.currentScene.blocks))}:null};
  if(isV7Life(state.life)&&state.director)result.director=buildDirectorContext(state.director,fixed.nextLife,fixed.receipt,fixed.identity.turnId);
  if(state.relationshipVersion===1) {

// History already selected for this action takes priority over flavor from
// the previous life. The complete sources stay in the child's immutable row.
function addEchoNotes(context,state){
 const notes=echoNotes(state.reincarnation);
 if(!notes.length)return;
 context.previousLife=notes;
 while(notes.length&&(bytes(context)>7000||bytes(JSON.stringify(context))>7000))notes.pop();
 if(!notes.length)delete context.previousLife;
}

function addRetrievalProjection(context,memory,serialized) {
  // Retrieval is optional prompt history. Preserve the previously legal state,
  // action and selected game memory before spending any remaining bytes on it.
  const projection=projectRetrievalMemory(memory);
  context.retrieval=projection;
  const fits=()=>bytes(context)<=7000&&(!serialized||bytes(JSON.stringify(context))<=7000);
  while(!fits()) {
    const candidates=['recentCardIds','recentEvidenceIds','recentFamilies'].filter(key=>projection[key].length).sort((a,b)=>bytes(projection[b])-bytes(projection[a])||a.localeCompare(b,'en'));
    if(!candidates.length){delete context.retrieval;break;}
    projection[candidates[0]].shift();
  }
}

// Selection changes only prompt coverage. Immutable rows and unresolved statuses
// remain in the archive; the same fixed action and candidates give the same DTO.
function selectRelevantMemory(result,records,state,entities,openTotal,currentTurnId) {
  const currentIds=new Set(state.relatedEntities.map(entity=>entity.id));
  const creditor=result.life.cultivationProfile?.experience?.commitment;
  const openCandidates=records.filter(row=>['promise','clue'].includes(row.kind)&&row.status==='open');
  if(openCandidates.length>openTotal)fail('STORY_CONTEXT_INVALID');
  result.entities=[...entities.values()].filter(entity=>currentIds.has(entity.id));
  result.memory={facts:[],promises:[],clues:[],recent:[],summaries:[]};
  result.coverage={policy:'relevance-v1',openTotal,openIncluded:0,openOmitted:openTotal};
  const canonicalRelations=result.relationships;
  const refresh=()=>{
    if(canonicalRelations)result.relationships=projectRelations({relations:{}},result.entities,canonicalRelations);
    result.references=Object.values(result.memory).flat().map(row=>row.id);
    const included=[...result.memory.promises,...result.memory.clues].filter(row=>row.status==='open').length;
    result.coverage.openIncluded=included;
    result.coverage.openOmitted=openTotal-included;
  };
  refresh();

  // that second JSON escaping layer, leaving room for fixed system/schema data.
  const fits=()=>result.entities.length<=24&&bytes(result)<=7000&&bytes(JSON.stringify(result))<=7000;

  // marked lives, give the latest actual turn/open record precedence over
  // duplicate director prose and hashes in this particular model projection.
  function makeRoom(){

      while(rows.length&&!fits())rows.shift();
      if(fits())return;
    }
    for(const [obj,key,max] of [[d.background,'text',0],[d.archive,'text',24],[d.world,'summary',24]]){
      obj[key]=Array.from(obj[key]).slice(0,max).join('');if(fits())return;
    }
  }
  makeRoom();if(!fits())fail('MEMORY_CONTEXT_TOO_LARGE');
  const target=result.receipt.action?.targetId;
  const directedReferences=new Set([state.director?.mainQuest,...(state.director?.sideQuests??[]),...(state.director?.memory.clues??[])].filter(Boolean).map(row=>row.id));
  const relevance=row=>row.entityId===target?0:currentIds.has(row.entityId)?1:2;
  const priority=row=>row.id===currentTurnId?-2:directedReferences.has(row.id)?-1:['promise','clue'].includes(row.kind)&&row.status==='open'?0:row.kind==='death'?1:['fact','relationship','receipt'].includes(row.kind)?2:3;

  const limits={facts:16,promises:12,clues:12,recent:4,summaries:2};
  // A creditor remains in the paid, hashed life even when their off-scene
  // archive identity cannot fit. First honor the preflighted latest turn;
  // then try to include the person, before spending space on older details.
  let returning=creditor?.status==='owed'?entities.get(creditor.entityId):null;
  const offerReturning=()=>{
    if(!returning)return;
    const entity=returning;returning=null;
    if(result.entities.length>=24||result.entities.some(e=>e.id===entity.id))return;
    const previous=result.entities,originalDirector=result.director;
    result.entities=[...previous,entity];refresh();
    if(!fits()){
      result.director=copy(originalDirector);makeRoom();
      if(!fits()){result.entities=previous;result.director=originalDirector;refresh();}
    }
  };
  for(const row of ordered) {
    if(row.id!==currentTurnId)offerReturning();
    const group=groups[row.kind];
    if(!group||result.memory[group].length>=limits[group])continue;
    if(row.kind==='summary'&&row.references.some(id=>!result.references.includes(id)))continue;
    const previousEntities=result.entities;
    const required=row.entityId?[row.entityId]:row.kind==='turn'?[...new Set([...row.entityIds,...(row.id===currentTurnId?[]:[...entities.values()].filter(entity=>row.text.includes(entity.name)).map(entity=>entity.id))])]:[];
    const missing=required.filter(id=>!result.entities.some(entity=>entity.id===id));
    if(missing.some(id=>!entities.has(id)))continue;
    result.entities=[...result.entities,...missing.map(id=>entities.get(id))];

    }

      result.entities=previousEntities;

// Public context is untrusted portable JSON at the HTTP boundary. The local
// builder re-derives pending; this checks consistency, not account authentication.
 function validateStoryContext(c) {
  inspect(c,7000);
  exactKeys(c,['schemaVersion','phase','identity','namespace','receipt','life','entities','memory','references','previousScene'],['coverage','relationshipVersion','relationships','director','retrieval','previousLife']);
  if(c.previousLife!==undefined&&(!isExperienceLife(c.life)||!validEchoNotes(c.previousLife)))fail('STORY_CONTEXT_INVALID');
  if(c.retrieval!==undefined)validateRetrievalMemory(c.retrieval);
  if(c.schemaVersion!==1||!['opening','choice'].includes(c.phase))fail('STORY_CONTEXT_INVALID');
  exactKeys(c.identity,['runId','turnId','baseRevision','stateHash','choiceId','rulesVersion','promptVersion','requestId']);
  idField(c.identity.runId);idField(c.identity.requestId);whole(c.identity.turnId,1);whole(c.identity.baseRevision);
  if(c.namespace!==namespace(c.identity.runId)||!/^[a-f0-9]{64}$/.test(c.identity.stateHash)||c.identity.rulesVersion!==1||c.identity.promptVersion!==1||c.identity.turnId!==c.identity.baseRevision+1)fail('STORY_CONTEXT_INVALID');
  if(c.phase==='opening'&&c.identity.baseRevision!==0||c.phase==='choice'&&c.identity.baseRevision<1)fail('STORY_CONTEXT_INVALID');
  validateLife(c.life);validateReceipt(c.receipt,{turnId:c.identity.turnId});

  if(c.phase==='opening'&&(!equal(c.life.items,initialItemsForBirth(c.life.birth))||Object.keys(c.life.relations).length))fail('ACTION_RECEIPT_MISMATCH');
  if(c.director!==undefined){if(!isV7Life(c.life))fail('STORY_CONTEXT_INVALID');validateStoryDirector(c.director,{turnId:c.identity.baseRevision,life:c.life});}
  else if(isV7Life(c.life))fail('STORY_DIRECTOR_INVALID');
  if(!Array.isArray(c.entities)||c.entities.length>24)fail('STORY_CONTEXT_INVALID');
  const seen=new Set();for(const e of c.entities){exactKeys(e,['id','name','kind','status'],['experience']);if(e.experience&&!isExperienceLife(c.life))fail('STORY_CONTEXT_INVALID');const {status,...entity}=e;validateEntities([entity]);if(seen.has(e.id)||!['unknown','alive','dead'].includes(e.status)||e.kind!=='person'&&e.status!=='unknown')fail('STORY_CONTEXT_INVALID');seen.add(e.id);}
  if(c.relationshipVersion!==undefined||c.relationships!==undefined){
    if(c.relationshipVersion!==1||c.relationships===undefined)fail('STORY_CONTEXT_INVALID');
    const projected=projectRelations({relations:{}},c.entities,c.relationships);
    if(!equal(projected,c.relationships)||c.phase==='opening'&&Object.keys(projected).length)fail('STORY_CONTEXT_INVALID');
    for(const [id,value] of Object.entries(c.life.relations))if(c.relationships[id]!==value)fail('STORY_CONTEXT_INVALID');
  }
  exactKeys(c.memory,['facts','promises','clues','recent','summaries']);
  const groupKinds={facts:['receipt','fact','relationship','death'],promises:['promise'],clues:['clue'],recent:['turn'],summaries:['summary']},records=[];
  for(const [key,rows] of Object.entries(c.memory)){
    if(!Array.isArray(rows)||rows.length>({facts:16,promises:12,clues:12,recent:4,summaries:2})[key])fail('STORY_CONTEXT_INVALID');
    for(const row of rows){validateRecord(row,{runId:c.identity.runId,turnId:c.identity.baseRevision});if(!groupKinds[key].includes(row.kind))fail('STORY_CONTEXT_INVALID');records.push(row);}
  }

  if(!Array.isArray(c.references)||c.references.length>48||new Set(ids).size!==ids.length||new Set(c.references).size!==c.references.length||!equal([...c.references].sort(),[...ids].sort()))fail('STORY_CONTEXT_INVALID');c.references.forEach(idField);
  for(const row of records){
    if(Object.hasOwn(row,'entityId')&&!seen.has(row.entityId))fail('MEMORY_REFERENCE_MISSING');

    for(const key of ['openTotal','openIncluded','openOmitted'])whole(c.coverage[key]);

const digits={'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function numberWord(text) {
  if(/^\d+$/.test(text))return Number(text);
  let total=0,n=0;for(const ch of text){if(Object.hasOwn(digits,ch))n=digits[ch];else{const unit={'十':10,'百':100,'千':1000,'万':10000}[ch];if(!unit)return NaN;if(unit===10000){total=(total+n)*unit;n=0;}else{total+=(n||1)*unit;n=0;}}}return total+n;
}
function checkMechanicalClaims(text,c) {
  const numerals='([0-9零〇一二两三四五六七八九十百千万]+)';
  for(const m of text.matchAll(new RegExp('你(?:如今|现在|今年)?(?:已经|已|年满)?'+numerals+'岁','g')))if(numberWord(m[1])!==Math.floor(c.life.ageDays/DAYS_PER_YEAR))fail('MECHANICAL_FACT_CONFLICT');
  for(const [id,realm] of Object.entries(realmCatalogFor(c.life))){
    const escaped=realm.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    if(new RegExp('你(?:如今|现在)?(?:已经|已)?(?:是|成为|突破至|踏入|晋入|达到)'+escaped).test(text)&&c.life.realm!==id)fail('MECHANICAL_FACT_CONFLICT');
  }
  for(const [id,name] of Object.entries(ITEMS)){
    const re=new RegExp('你(?:已经|已)?(拥有|现有|获得|得到|消耗|失去)(?:了)?'+numerals+'(?:枚|块|份|本|个|张)?'+name,'g');
    for(const m of text.matchAll(re)){
      const value=numberWord(m[2]),change=c.receipt.itemChanges[id]??0;
      const expected=['拥有','现有'].includes(m[1])?(c.life.items[id]??0):['消耗','失去'].includes(m[1])?Math.max(0,-change):Math.max(0,change);
      if(value!==expected)fail('MECHANICAL_FACT_CONFLICT');
    }
  }
}
function compilationState(c,scene) {

function notify(message, error = false) {
  const toast = $('#toast');
  toast.textContent = message;
  toast.className = `toast show${error ? ' error' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove('show'); }, error ? 6000 : 4200);
}

function focusAdventure(target, keepPosition = false) {
  target?.focus({ preventScroll: true });
  target?.scrollIntoView({ block: keepPosition ? 'nearest' : 'start', behavior: 'instant' });
}

function captureFocusTarget(element = document.activeElement) {
  if (!element || element === document.body) return null;
  // Action identity survives a redraw; revision/state metadata does not.
  const attributes = [...element.attributes].filter(({ name }) => name.startsWith('data-') && !['data-revision', 'data-state-hash', 'data-scene-id'].includes(name));
  const selector = element.id ? `#${CSS.escape(element.id)}` : attributes.length ? element.localName + attributes.map(({ name, value }) => `[${name}="${CSS.escape(value)}"]`).join('') : null;
  return { element, selector, sceneFallback: element.matches('[data-live-choice], [data-live-start], [data-live-new], [data-live-retry], [data-live-resume], [data-live-custom-toggle], [data-live-custom-submit], [data-live-custom-field], [data-live-reincarnate]') };
}

function resolveFocusTarget(target) {
  const element = target?.element.isConnected ? target.element : target?.selector ? $(target.selector) : null;
  return element && !element.matches(':disabled') ? element : target?.sceneFallback ? $('#journey-current-title') : null;
}

function openDialog(title, body, actions = '', { drawer = false } = {}) {
  const dialog = $('#dialog');
  if (!dialog.open) dialogReturnTarget = captureFocusTarget();
  dialog.className = drawer ? 'paper-drawer' : '';
  dialog.innerHTML = `<header class="dialog-header"><h2 id="dialog-title" tabindex="-1">${esc(title)}</h2><button class="icon-button" data-close-dialog aria-label="关闭">${icon('close')}</button></header><div class="dialog-body">${body}</div>${actions ? `<footer class="dialog-actions">${actions}</footer>` : ''}`;
  if (!dialog.open) dialog.showModal();
  $('#dialog-title')?.focus({ preventScroll: true });
}

function closeDialog(restoreFocus = true) {
  const target = dialogReturnTarget;
  dialogReturnTarget = null;
  dialogConfirm = null;
  $('#dialog').close();
  if (restoreFocus) resolveFocusTarget(target)?.focus({ preventScroll: true });
}

function confirmAction(title, body, callback, label = '确认继续') {

function downloadText(filename, text, mime = 'application/json;charset=utf-8') {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const link = document.createElement('a'); link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function ensureLive() {
  if(liveSession)return;
  if(!liveInitialization)liveInitialization=(async()=>{
    liveArchive=await openLiveArchive();
    liveSession=createLiveSession({archive:liveArchive,client:liveClient,onProgress:snapshot=>{
      liveSnapshot=snapshot;
      if(view==='adventure')updateLiveJourney($('#app'),liveStoryView(snapshot));
    },onChange:snapshot=>{
      liveSnapshot=snapshot;
      if(creatingRunId&&snapshot.state?.runId===creatingRunId){if(view==='new')view='adventure';}
      render();
    }});
  })();
  try {await liveInitialization;}catch(error){liveInitialization=null;throw error;}
}

async function beginLiveLife() {
  if(uiBusy||view!=='new')return;
  const name=$('#live-name')?.value?.trim()??liveBirthDraft.name,originId=$('#live-origin')?.value??liveBirthDraft.originId;
  liveBirthDraft={...liveBirthDraft,name,originId};uiBusy=true;liveError='';render();
  try {
    await ensureLive();
    creatingRunId=window.crypto.randomUUID();
    const options={runId:creatingRunId,name,originId,seed:newSeed(),engineVersion:7};
    if(liveBirthDraft.reincarnationRunId&&liveSnapshot?.state?.runId!==liveBirthDraft.reincarnationRunId)throw Error('reincarnation parent changed');
    const result=liveBirthDraft.reincarnationRunId
      ?await liveSession.reincarnate(options,liveBirthDraft.reincarnationRewardIds??[],liveBirthDraft.expectedArchiveId)
      :await liveSession.startNew(options,liveBirthDraft.expectedArchiveId);
    if(result.state?.runId===creatingRunId){if(view==='new')view='adventure';liveBirthDraft={name,originId,expectedArchiveId:result.archiveId};}
    else if(result.errorCode==='REINCARNATION_ALREADY_CLAIMED')liveError='此生传承已领取。请恢复下一世备份，或返回首页重新开始。';
    else if(result.errorCode==='REINCARNATION_INSUFFICIENT_POINTS')liveError='因果点不足，请返回此生结算重新选择传承。';
    else if(result.errorCode==='EXPERIENCE_UNSUPPORTED')liveError='故事服务暂不支持这次轮回的修行规则。原存档已保留，请稍后再试。';
    else if(['NETWORK_UNAVAILABLE','AI_DISABLED','SERVICE_UNAVAILABLE','PROTOCOL_MISMATCH'].includes(result.errorCode))liveError='暂时无法确认故事服务可用。原存档已保留，请稍后再试。';
    else if(result.errorCode!=='BIRTH_CONTEXT_INVALID')liveError='另一页面可能已更新存档，或本地存档无法保存。请返回首页后重新创建，原进度保持不变。';
  } catch { liveError='无法开始，请检查本地存储与网络。原有旅程保持不变。'; }
  finally {uiBusy=false;creatingRunId=null;render();}
}

function currentLiveActionDraft(snapshot=liveSnapshot) {
  const key=JSON.stringify([snapshot?.archiveId,snapshot?.state?.runId,snapshot?.state?.revision]);
  if(liveActionDraft.key!==key)liveActionDraft={key,open:false,text:'',error:''};
  return liveActionDraft;
}

function liveStoryView(snapshot) {
  if(!snapshot?.state)return null;
  return {...snapshot,stateHash:stateHash(snapshot.state),itemNames:LIVE_ITEMS,characterSummary:liveCharacterSummary(snapshot.state,liveCatalogs),customAction:currentLiveActionDraft(snapshot),selectedReincarnationRewards:liveBirthDraft.reincarnationRunId===snapshot.state.runId?liveBirthDraft.reincarnationRewardIds??[]:[]};
}

function selectReincarnationReward(rewardId) {
  const snapshot=liveSnapshot;
  if(!snapshot?.state||snapshot.busy||snapshot.pending||snapshot.reincarnatedTo||!getReincarnationSettlement(snapshot.state))return;
  if(!REINCARNATION_REWARDS.some(reward=>reward.id===rewardId))return;
  const current=liveBirthDraft.reincarnationRunId===snapshot.state.runId?liveBirthDraft.reincarnationRewardIds??[]:[];
  const selected=current.includes(rewardId)?current.filter(id=>id!==rewardId):[...current,rewardId];
  try {buildRebirthOptions(snapshot.state,selected);}catch(error){return notify(error.code==='REINCARNATION_SELECTION_LIMIT'?'每世最多携入两项传承。':'因果点不足，无法携入这项传承。',true);}
  liveBirthDraft={name:liveBirthDraft.reincarnationRunId===snapshot.state.runId?liveBirthDraft.name:snapshot.state.life.name,originId:liveBirthDraft.reincarnationRunId===snapshot.state.runId?liveBirthDraft.originId:'village',expectedArchiveId:snapshot.archiveId,reincarnationRunId:snapshot.state.runId,reincarnationRewardIds:selected};
  saveCreationDraft();render();
}

function prepareReincarnation() {
  const snapshot=liveSnapshot;
  if(uiBusy||!snapshot?.state||snapshot.busy||snapshot.pending||snapshot.reincarnatedTo||!getReincarnationSettlement(snapshot.state))return;
  const sameParent=liveBirthDraft.reincarnationRunId===snapshot.state.runId;
  const selected=sameParent?liveBirthDraft.reincarnationRewardIds??[]:[];
  try {buildRebirthOptions(snapshot.state,selected);}catch{return notify('因果点不足，请重新选择来世传承。',true);}
  liveBirthDraft={name:sameParent?liveBirthDraft.name:snapshot.state.life.name,originId:sameParent?liveBirthDraft.originId:'village',expectedArchiveId:snapshot.archiveId,reincarnationRunId:snapshot.state.runId,reincarnationRewardIds:selected};
  liveError='';view='new';returnScreen='adventure';saveCreationDraft();render();$('#live-name')?.focus({preventScroll:true});
}

async function submitLiveCustomAction() {
  const snapshot=liveSnapshot;
  if(!liveSession||snapshot?.busy||snapshot?.pending||snapshot?.state?.phase!=='active'||snapshot.state.life.cultivationProfile?.version!==7)return;
  const draft=currentLiveActionDraft(),text=$('#live-custom-action')?.value??draft.text;
  draft.text=text;draft.error='';draft.open=true;
  if(!text.trim()||text.length>120){draft.error=unsupportedAction;render();$('#live-custom-action')?.focus({preventScroll:true});return;}
  const numeric=text.trim().match(/^[1-3]$/),choice=numeric?snapshot.state.currentScene.choices[Number(numeric[0])-1]:null;
  const result=await liveSession.choose({...(choice?{choiceId:choice.id}:{customAction:text}),baseRevision:snapshot.state.revision,stateHash:stateHash(snapshot.state)});
  if(result.errorCode==='CUSTOM_ACTION_UNSUPPORTED'){
    draft.error=unsupportedAction;render();$('#live-custom-action')?.focus({preventScroll:true});
  }
}

function renderLiveApp() {
  const focus = !$('#dialog').open && $('#app').contains(document.activeElement) ? captureFocusTarget() : null;
  const snapshot=liveSnapshot,liveState=snapshot?.state;
  const header=liveState?renderIdentityBar(liveCharacterSummary(liveState,liveCatalogs)):'<h1>百世问鼎</h1>';
  const storyView=liveStoryView(snapshot);
  const choices=liveState?.phase==='active'?compileChoices(liveState,liveState.currentScene.choices):[];

  $('#app').innerHTML=`<div class="paper-page paper-page-immersive"><header class="paper-top paper-top-immersive">${header}</header><main id="main-content" class="paper-main" tabindex="-1">${liveError?`<p class="notice" role="status">${esc(liveError)}</p>`:''}${content}</main>${renderGameNavigation({history:Boolean(liveState)})}</div>`;
  if(previousStory&&storyView&&updateLiveJourney(previousStory,storyView,choices))$('#app').querySelector('[data-live-story]').replaceWith(previousStory);
  resolveFocusTarget(focus)?.focus({ preventScroll: true });

async function showLiveHistory(first) {
  if(!liveArchive||!liveSnapshot?.state)return;
  try { const run=liveSnapshot.state.runId;if(first||run!==liveHistoryRun){liveHistoryRun=run;liveHistoryCursor=null;}const page=await liveArchive.readHistory(run,liveHistoryCursor,16);liveHistoryCursor=page.cursor;openDialog('历史对话',renderLiveHistory(page.entries,liveSnapshot.state.life.name),`<button class="button" data-live-history-first>从头阅读</button>${page.cursor?'<button class="button" data-live-history-next>下一页</button>':''}`,{drawer:true}); }
  catch { notify('历史读取暂未完成，请重试。',true); }
}

async function showRetainedArchives(cursor = null) {
  try {
    await ensureLive();
    const page = await liveArchive.listRetainedArchives(cursor);
    const rows = page.entries.map(row => `<section class="settings-section" data-retained-row="${esc(row.archiveId)}"><h3>${esc(row.name)}</h3><p>${row.phase === 'dead' ? '此生已尽' : '旧日进度'} · 第 ${row.turnId} 回</p><div class="settings-actions"><button class="button" data-retained-read="${esc(row.archiveId)}">只读查看</button><button class="button" data-retained-export="${esc(row.archiveId)}">导出备份</button></div></section>`).join('');
    openDialog('历世与旧备份', `<p>这里保留先前人生与恢复前的备份。只读查看不会推进故事；需要恢复时，请先导出备份，再通过恢复备份确认替换当前进度。</p>${rows || '<p>本页暂无旧记录。</p>'}`, `${cursor ? '<button class="button" data-retained>回到第一页</button>' : ''}${page.cursor ? `<button class="button" data-retained-next="${esc(page.cursor)}">下一页</button>` : ''}`, { drawer: true });
  } catch { notify('旧记录暂时无法读取，原始存档保持不变。', true); }
}

async function showRetainedHistory(archiveId, next = false) {
  try {
    const row = await liveArchive.readRetainedArchive(archiveId);
    const cursor = next && retainedHistory?.archiveId === archiveId ? retainedHistory.cursor : null;
    const page = await liveArchive.readRetainedHistory(archiveId, cursor, 16);
    retainedHistory = { archiveId, cursor: page.cursor };
    openDialog(`${row.state.life.name} · 只读历史`, `${renderCharacterDetails(liveCharacterSummary(row.state, liveCatalogs))}${renderLiveHistory(page.entries, row.state.life.name)}`, `<button class="button" data-retained>返回历世</button><button class="button" data-retained-read="${esc(archiveId)}">从头阅读</button>${page.cursor ? `<button class="button" data-retained-history-next="${esc(archiveId)}">下一页</button>` : ''}<button class="button" data-retained-export="${esc(archiveId)}">导出备份</button>`, { drawer: true });
  } catch { notify('历史读取暂未完成，请重试。原始存档保持不变。', true); }
}

async function exportLiveGame(physical = null) {
  if(!liveArchive||!physical&&!liveSnapshot?.state)return notify('尚无存档可导出。',true);
  try {
    const snapshot=physical?await liveArchive.readRetainedArchive(physical):liveSnapshot;
    const filename=`百世问鼎-${snapshot.state.life.name}.wending.jsonl`;
    // File System Access streams directly where available; Blob fallback only
    // affects download memory, never the stored archive or the history DOM.
    if(typeof window.showSaveFilePicker==='function') {
      const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'完整存档备份',accept:{'application/octet-stream':['.jsonl']}}]});
      const writable=await handle.createWritable();await exportLiveArchive(liveArchive,snapshot.state.runId,physical).pipeTo(writable);
    } else {
      const blob=await new Response(exportLiveArchive(liveArchive,snapshot.state.runId,physical)).blob();downloadText(filename,blob,'application/octet-stream');
    }
    notify('存档已导出。');
  } catch(error) { if(error.name!=='AbortError')notify('导出未完成，请重试并保留本机存档。',true); }
}

document.addEventListener('input', event => {
  if (event.target.id === 'live-name') { liveBirthDraft.name = event.target.value; saveCreationDraft(); }
  if (event.target.id === 'live-custom-action') {
    const draft = currentLiveActionDraft(); draft.text = event.target.value; draft.error = '';

});
document.addEventListener('change', event => {

  if (event.target.id === 'reading-theme' || event.target.id === 'reading-size') {

});
document.addEventListener('submit', event => {
  if (event.target?.id === 'live-birth-form') { event.preventDefault(); return beginLiveLife(); }
  if (event.target?.id === 'live-custom-form') { event.preventDefault(); return submitLiveCustomAction(); }
});
document.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.repeat || event.isComposing || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || view !== 'adventure' || $('#dialog').open || liveSnapshot?.busy || liveSnapshot?.pending || liveSnapshot?.state?.life.cultivationProfile?.version !== 7) return;
  if (event.target?.closest?.('input,textarea,select,[contenteditable="true"]')) return;
  if (!/^[1-4]$/.test(event.key)) return;
  const button = event.key === '4' ? $('[data-live-custom-toggle]') : $(`[data-live-choice-index="${Number(event.key) - 1}"][data-live-choice]`);
  if (!button || button.disabled) return;
  event.preventDefault(); button.click();
});
document.addEventListener('click', event => {
  const button = event.target.closest('button,a');
  if (!button || button.disabled) return;
  const data = button.dataset;
  if ('closeDialog' in data) { closeDialog(); return; }
  if ('confirm' in data) { const callback = dialogConfirm; closeDialog(false); callback?.(); return; }
  if ('home' in data) return goHome();
  if ('titleNew' in data) return prepareNewJourney();
  if ('restart' in data || 'liveNew' in data) return askNewJourney();
  if ('titleContinue' in data) return continueJourney();
  if ('menuBack' in data) {
    if (view === 'new') { if (liveBirthDraft.reincarnationRunId) { view = 'adventure'; render(); return; } return goHome(); }
    if (returnScreen === 'adventure') return continueJourney();
    if (returnScreen === 'new') { view = 'new'; returnScreen = 'home'; render(); return; }
    return goHome();
  }
  if ('liveStart' in data) { event.preventDefault(); return beginLiveLife(); }
  if ('liveReward' in data) return selectReincarnationReward(data.liveReward);
  if ('liveReincarnate' in data) return prepareReincarnation();
  if ('liveRetry' in data) return liveSession?.retry();
  if ('liveResume' in data) return liveSession?.resume();
  if ('liveChoice' in data) { currentLiveActionDraft().error = ''; return liveSession?.choose({ choiceId: data.liveChoice, baseRevision: Number(data.revision), stateHash: data.stateHash }); }
  if ('liveExample' in data) {
    const draft=currentLiveActionDraft(),field=$('#live-custom-action');
    if(!draft.open||!field||field.disabled||liveSnapshot?.busy||liveSnapshot?.pending)return;
    draft.text=data.liveExample;draft.error='';render();$('#live-custom-action')?.focus({preventScroll:true});return;
  }
  if ('liveCustomToggle' in data) { const draft = currentLiveActionDraft(); draft.open = !draft.open; render(); if (draft.open) $('#live-custom-action')?.focus({ preventScroll: true }); return; }
  if ('liveHistoryNext' in data) return showLiveHistory(false);
  if ('liveHistoryFirst' in data || 'history' in data) return showLiveHistory(true);
  if ('character' in data) return showCharacter();
  if ('help' in data) return showHelp();
  if (data.view === 'settings') {
    closeDialog(false);
    if (view !== 'settings') returnScreen = ['adventure', 'new'].includes(view) ? view : 'home';
    view = 'settings'; render(); $('#settings-title')?.focus({ preventScroll: true }); return;
  }
  if ('retained' in data) return showRetainedArchives();
  if ('retainedNext' in data) return showRetainedArchives(data.retainedNext);
  if ('retainedRead' in data) return showRetainedHistory(data.retainedRead);
  if ('retainedHistoryNext' in data) return showRetainedHistory(data.retainedHistoryNext, true);
  if ('retainedExport' in data) return exportLiveGame(data.retainedExport);
  if ('export' in data) return exportLiveGame();
  if ('import' in data) { $('#import-file').click(); return; }
  if ('exportLegacy' in data) {
    try { downloadText('百世问鼎-旧版原始数据.json', JSON.stringify(Object.fromEntries(legacyKeys.map(key => [key, storage.getItem(key)])), null, 2)); }
    catch { notify('原始数据暂时无法读取，请检查浏览器存储设置。', true); }
  }
});

$('#import-file').addEventListener('change', async event => {
  const file = event.target.files?.[0]; event.target.value = '';
  if (!file) return;
  if (uiBusy || liveSnapshot?.busy) return notify('故事正在保存，请稍候再恢复备份。', true);
  if (!file.name?.endsWith('.wending.jsonl')) return notify('请选择 .wending.jsonl 格式的完整存档备份。', true);
  confirmAction('恢复存档备份', '<p>游戏只有一个存档。备份通过完整校验后，会覆盖当前进度；校验或保存失败时，原进度保持不变。</p>', async () => {
    if (uiBusy || liveSnapshot?.busy) return notify('故事正在保存，请稍后恢复。', true);
    uiBusy = true; render();
    try {
      await ensureLive(); await importLiveArchive(file.stream(), liveArchive);
      liveError = ''; view = 'adventure'; await liveSession.load(); render();
      await liveSession.resume(); notify('存档已校验并恢复。');
    } catch { notify('备份未能恢复，原进度保持不变。', true); }
    finally { uiBusy = false; render(); }
  }, '确认覆盖并恢复');
});
