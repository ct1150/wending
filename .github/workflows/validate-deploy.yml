name: Validate and deploy to Cloudflare

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baishi-wending-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Test, syntax check, and build
        run: npm run release
      - name: Preserve static site and offline release
        uses: actions/upload-artifact@v7
        with:
          name: baishi-wending-${{ github.sha }}
          path: |
            dist/
            release/
          if-no-files-found: error
          retention-days: 14
      - name: Report deployment disabled
        if: vars.ENABLE_CF_DEPLOY != 'true'
        run: echo 'Validation succeeded. Cloudflare deployment is disabled because ENABLE_CF_DEPLOY is not true. No site was published by this workflow.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_CF_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Deployment blocked: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub repository or production environment secrets. No Cloudflare deployment was attempted.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Rebuild validated source
        run: npm run build
      - name: Deploy static assets to Cloudflare Workers
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
      - name: Report actual deployment result
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          echo 'Wrangler reported a successful Cloudflare deployment.' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOYMENT_URL" ]; then
            printf '\nURL: %s\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No URL was returned by the action; inspect Wrangler output and verify the live site before announcing it.' >> "$GITHUB_STEP_SUMMARY"
          fi
