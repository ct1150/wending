name: Validate and publish game

on:
  push:
    branches-ignore:
      - release-channel
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baishi-wending-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install native IndexedDB test browser
        run: npx playwright install --with-deps chromium
      - name: Test, syntax check, and build
        run: npm run release
      - name: Package static gateway and disabled compatible story backend
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          npm run build:gateway
          test -f release/backend/deployment.json
      - name: Preserve static site and web release
        uses: actions/upload-artifact@v7
        with:
          name: baishi-wending-${{ github.sha }}
          path: |
            dist/
            release/
            wrangler.story.json
            config/story-deployment.json
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download this run's validated artifact
        uses: actions/download-artifact@v8
        with:
          name: baishi-wending-${{ github.sha }}
      - name: Publish immutable release and manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          npm run publish:release | tee release/publication-result.txt
          cat release/publication-result.txt >> "$GITHUB_STEP_SUMMARY"
          echo 'The ordinary static gateway refreshes the verified web game from release-channel. Production backend packages pin their frontend and require a separate compatible deployment, including retirement of the old offline download route. /healthz reports the frontend actually served. The story backend artifact is disabled and is not deployed by this workflow; HTML publication does not verify AI, account billing, bindings, or worldwide propagation.' >> "$GITHUB_STEP_SUMMARY"
